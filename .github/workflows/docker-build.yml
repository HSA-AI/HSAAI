name: HSAAI Docker Build Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-validation:
    name: Docker Environment Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout HSAAI Repository
        uses: actions/checkout@v4


      - name: Prepare CI Environment Variables
        run: |
          cat > .env <<EOF
          SESSION_SECRET=ci-validation-secret
          JWT_SECRET=ci-validation-jwt-secret

          POSTGRES_PASSWORD=ci-validation-password
          POSTGRES_USER=postgres
          POSTGRES_DB=hsaai

          REDIS_PASSWORD=ci-validation-password

          NEO4J_PASSWORD=ci-validation-password

          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=ci-validation-minio-password

          QDRANT_API_KEY=ci-validation-qdrant-key

          KEYCLOAK_ADMIN=admin
          KEYCLOAK_ADMIN_PASSWORD=ci-validation-keycloak-password

          GRAFANA_ADMIN_PASSWORD=ci-validation-grafana-password

          SECRET_KEY=ci-validation-secret-key
          ENCRYPTION_KEY=ci-validation-encryption-key

          OAUTH_CLIENT_SECRET=ci-validation-oauth-secret

          DATABASE_URL=postgresql://postgres:ci-validation-password@postgres:5432/hsaai

          EOF


      - name: Docker Version Check
        run: |
          docker --version
          docker compose version


      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet


      - name: Validate Production Compose Configuration
        run: |
          if [ -f docker-compose.production.yml ]; then
            # Temporary CI-only values for configuration validation.
            export APP_PUBLIC_URL="https://ci.example.invalid"
            export KEYCLOAK_PUBLIC_URL="https://idp.ci.example.invalid"
            for name in APP_DB_PASSWORD AUDIT_HMAC_KEY DATA_ENCRYPTION_KEY JWT_SECRET KEYCLOAK_ADMIN_PASSWORD KEYCLOAK_DB_PASSWORD MIGRATION_DB_PASSWORD MINIO_ROOT_PASSWORD MLFLOW_DB_PASSWORD SESSION_SECRET; do
              export "$name=$(openssl rand -hex 32)"
            done
            docker compose -f docker-compose.production.yml config --quiet
          else
            echo "Production compose file not found - skipped"
          fi


      - name: Check Docker Files
        run: |
          test -f docker-compose.yml
          test -f docker-compose.production.yml
          test -f docker-compose.gpu.yml || true

          echo "Docker files validation completed"


      - name: Validate Required Project Components
        run: |
          test -d services
          test -d apps
          test -d infrastructure
          test -d deployment

          echo "HSAAI project structure validated"


      - name: Docker Validation Completed
        run: |
          echo "===================================="
          echo "HSAAI Docker Validation Completed"
          echo "===================================="
