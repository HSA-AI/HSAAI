name: HSAAI Docker Build Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-validation:
    name: Docker Environment Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout HSAAI Repository
        uses: actions/checkout@v4

      - name: Prepare CI Environment Variables
        run: |
          cat > .env <<EOF
          SESSION_SECRET=ci-validation-secret
          NEO4J_PASSWORD=ci-validation-password
          POSTGRES_PASSWORD=ci-validation-password
          REDIS_PASSWORD=ci-validation-password
          JWT_SECRET=ci-validation-jwt-secret
          EOF

      - name: Docker Version Check
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose
        run: |
          docker compose config

      - name: Check Docker Files
        run: |
          test -f docker-compose.yml
          test -f docker-compose.production.yml
          echo "Docker configuration validated"

      - name: Docker Validation Completed
        run: |
          echo "HSAAI Docker validation completed successfully"
