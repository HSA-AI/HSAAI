name: HSAAI Full Backend Coverage

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-backend-coverage:
    name: Full Python test suite and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir             -r requirements-validation.txt             -r tests/requirements.txt
          python -m pip install --no-cache-dir             pytest==8.4.2 pytest-cov
          python -m pytest --version

      - name: Run full suite with 80 percent coverage gate
        run: |
          python -m pytest -q -ra             --cov-report=json:coverage.json

      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsaai-backend-coverage
          path: |
            coverage.json
            tests/coverage.xml
          if-no-files-found: warn
          retention-days: 7
