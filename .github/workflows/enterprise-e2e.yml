name: HSAAI Enterprise E2E

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "docker-compose.production.yml"
      - "infrastructure/minio/**"
      - "services/**"
      - "scripts/deploy-production.sh"
      - "scripts/enterprise_e2e_core.sh"
      - ".github/workflows/enterprise-e2e.yml"

permissions:
  contents: read

concurrency:
  group: enterprise-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enterprise-e2e:
    name: Enterprise E2E Core Path
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            2>/dev/null || true

          docker system prune -af || true
          df -h

      - name: Prepare ephemeral E2E environment
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import re
          import secrets
          from pathlib import Path

          compose = Path("docker-compose.production.yml").read_text()

          required = sorted(
              set(
                  re.findall(
                      r"\$\{([A-Z][A-Z0-9_]*):\?[^}]*\}",
                      compose,
                  )
              )
          )

          special = {
              "POSTGRES_PASSWORD": "hsaai-ci-postgres-" + secrets.token_hex(12),
              "REDIS_PASSWORD": "hsaai-ci-redis-" + secrets.token_hex(12),
              "NEO4J_PASSWORD": "hsaai-ci-neo4j-" + secrets.token_hex(12),
              "MINIO_ROOT_USER": "hsaai_minio_admin",
              "MINIO_ROOT_PASSWORD": "hsaai-ci-minio-" + secrets.token_hex(12),
              "KEYCLOAK_ADMIN": "admin",
              "KEYCLOAK_ADMIN_PASSWORD": "hsaai-ci-keycloak-" + secrets.token_hex(12),
              "GRAFANA_PASSWORD": "hsaai-ci-grafana-" + secrets.token_hex(12),
              "MLFLOW_DB_PASSWORD": "hsaai-ci-mlflow-" + secrets.token_hex(12),
              "OPENAI_API_KEY": "ci-disabled",
              "KEYCLOAK_REALM": "hsaai",
              "KEYCLOAK_CLIENT_ID": "hsaai-frontend",
              "KEYCLOAK_ISSUER": "http://keycloak:8080/realms/hsaai",
              "OLLAMA_BASE_URL": "http://ollama:11434",
          }

          env = {}

          for name in required:
              if name in special:
                  env[name] = special[name]
              elif "PORT" in name:
                  env[name] = "1"
              elif name.endswith("_REPLICAS"):
                  env[name] = "1"
              else:
                  env[name] = "hsaai-ci-" + secrets.token_hex(16)

          env.update(special)

          env.update({
              "ALLOW_EXTERNAL_AI": "false",
              "ALLOW_EXTERNAL_APIS": "false",
              "INTERNAL_ONLY_MODE": "true",
              "AUTH_REQUIRED": "true",
              "ALLOW_DEV_AUTH": "false",
              "ALLOW_DEV_RBAC": "false",
          })

          Path(".env").write_text(
              "".join(
                  f"{key}={value}\n"
                  for key, value in sorted(env.items())
              )
          )

          print(
              f"Prepared ephemeral environment with "
              f"{len(env)} variables"
          )
          PY

      - name: Validate production compose
        run: |
          set -euo pipefail

          docker compose \
            --env-file .env \
            -f docker-compose.production.yml \
            config --quiet

      - name: Run enterprise E2E
        run: |
          set -euo pipefail
          ./scripts/enterprise_e2e_core.sh
