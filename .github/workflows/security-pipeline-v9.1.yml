name: HSAAI Enterprise Security Pipeline v9.1

on:
  push:
    branches: [main, develop, 'release/*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  # ═══════════════════════════════════════════════════════════════════
  # Stage 1: Lint & Code Quality
  # ═══════════════════════════════════════════════════════════════════
  lint:
    name: 📝 Lint & Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install linting tools
        run: |
          pip install ruff black isort bandit
      - name: Run Ruff (linting)
        run: ruff check services/ packages/ tests/
      - name: Run Black (formatting check)
        run: black --check services/ packages/ tests/
      - name: Run isort (import sorting)
        run: isort --check-only services/ packages/ tests/
      - name: Run Bandit (security linting)
        run: bandit -r services/ -f json -o bandit-report.json || true
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

  # ═══════════════════════════════════════════════════════════════════
  # Stage 2: Unit Tests
  # ═══════════════════════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e packages/common/
          pip install -r services/backend_core/requirements.txt
          pip install -r tests/requirements.txt
          pip install python-jose passlib bcrypt
      - name: Run unit tests
        run: |
          cd HSAAI
          python -m pytest tests/unit/ \
            --no-cov \
            --tb=short \
            --override-ini="addopts=" \
            -q
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: HSAAI/tests/.pytest_cache/

  # ═══════════════════════════════════════════════════════════════════
  # Stage 3: Security Tests (Critical — Must Pass)
  # ═══════════════════════════════════════════════════════════════════
  security-tests:
    name: 🔒 Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e packages/common/
          pip install -r services/backend_core/requirements.txt
          pip install -r tests/requirements.txt
          pip install python-jose passlib bcrypt
      - name: Run authorization tests (has_permission)
        run: |
          cd HSAAI
          python -m pytest tests/security/test_has_permission_comprehensive.py \
            --no-cov \
            --tb=short \
            --override-ini="addopts=" \
            -q
      - name: Run tenant isolation tests
        run: |
          cd HSAAI
          python -m pytest tests/security/test_qdrant_tenant_isolation.py \
            --no-cov \
            --tb=short \
            --override-ini="addopts=" \
            -q
      - name: Run v9.1 upgrade tests (rate limit, retry, circuit breaker)
        run: |
          cd HSAAI
          python -m pytest tests/security/test_qdrant_v91_upgrades.py \
            --no-cov \
            --tb=short \
            --override-ini="addopts=" \
            -q
      - name: Run Qdrant delete comprehensive tests
        run: |
          cd HSAAI
          python -m pytest tests/backend/test_qdrant_delete_comprehensive.py \
            --no-cov \
            --tb=short \
            --override-ini="addopts=" \
            -q
      - name: Security tests summary
        if: always()
        run: |
          echo "## Security Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Authorization (has_permission): 317 tests" >> $GITHUB_STEP_SUMMARY
          echo "- Tenant Isolation: 90 tests" >> $GITHUB_STEP_SUMMARY
          echo "- v9.1 Upgrades: 56 tests" >> $GITHUB_STEP_SUMMARY
          echo "- Qdrant Delete: 66 tests" >> $GITHUB_STEP_SUMMARY
          echo "- **Total: 529 security tests**" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════════
  # Stage 4: Coverage Report
  # ═══════════════════════════════════════════════════════════════════
  coverage:
    name: 📊 Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: security-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          pip install -e packages/common/
          pip install -r services/backend_core/requirements.txt
          pip install -r tests/requirements.txt
          pip install python-jose passlib bcrypt
      - name: Run tests with coverage
        run: |
          cd HSAAI
          python -m pytest tests/security/test_qdrant_tenant_isolation.py \
            tests/security/test_qdrant_v91_upgrades.py \
            --cov=backend_core.knowledge.qdrant_client_secure \
            --cov=backend_core.knowledge.qdrant_v91_upgrades \
            --cov=backend_core.security.rbac \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --override-ini="addopts=" \
            -q
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: HSAAI/coverage.xml

  # ═══════════════════════════════════════════════════════════════════
  # Stage 5: Container Security Scan
  # ═══════════════════════════════════════════════════════════════════
  container-scan:
    name: 🐳 Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: security-tests
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-report.json'
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-security-report
          path: trivy-report.json

  # ═══════════════════════════════════════════════════════════════════
  # Stage 6: Build
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [security-tests, coverage, container-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker images
        run: |
          cd HSAAI
          docker build -t hsaai/backend-core:latest services/backend_core/
          docker build -t hsaai/rag-engine:latest services/rag_engine/
      - name: Save Docker images
        run: |
          docker save hsaai/backend-core:latest | gzip > backend-core.tar.gz
          docker save hsaai/rag-engine:latest | gzip > rag-engine.tar.gz
      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: |
            backend-core.tar.gz
            rag-engine.tar.gz

  # ═══════════════════════════════════════════════════════════════════
  # Stage 7: Deploy (Manual Approval Required)
  # ═══════════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.hsaai.group
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          echo "This would trigger ArgoCD sync"
      - name: Run smoke tests
        run: |
          echo "Running production smoke tests..."
          # curl https://api.hsaai.group/health
