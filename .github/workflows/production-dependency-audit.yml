name: HSAAI Production Dependency Audit

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install audit tool
        run: python -m pip install pip-audit==2.10.1

      - name: Audit Python project
        run: python -m pip_audit --strict .

  frontend-dependency-audit:
    name: Frontend dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Audit frontend dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high
