networks:
  default:
    driver: bridge
  hsaai_private:
    driver: bridge
    internal: true
services:
  agent-runtime:
    build:
      context: .
      dockerfile: services/multi_agents/Dockerfile
    cap_drop:
    - ALL
    depends_on:
    - llm-gateway
    - rag-service
    - kafka
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      APP_ENV: production
      AUTH_SERVICE_URL: http://auth-service:8010
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_AUDIENCE: hsaai-api
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      LLM_GATEWAY_URL: http://llm-gateway:8090
      RAG_ENGINE_URL: http://rag-service:8030
      REDIS_URL: redis://redis:6379/0
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - hsaai_private
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  alignment-service:
    build:
      context: .
      dockerfile: services/ai_alignment/Dockerfile
    cap_drop:
    - ALL
    depends_on:
    - llm-gateway
    - redis
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      APP_ENV: production
      AUTH_SERVICE_URL: http://auth-service:8010
      KEYCLOAK_AUDIENCE: hsaai-api
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      LLM_GATEWAY_URL: http://llm-gateway:8090
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      SAFETY_REDIS_URL: redis://redis:6379/3
      RATE_LIMIT_REDIS_URL: redis://redis:6379/6
      RATE_LIMIT_FAILURE_MODE: closed
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 10s
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8005/health')
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - hsaai_private
    ports:
    - 127.0.0.1:8005:8005
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    cap_drop:
    - ALL
    depends_on:
    - llm-gateway
    - auth-service
    - rag-service
    - backend-core
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      AI_ORCHESTRATOR_URL: http://agent-runtime:8040
      ANALYTICS_URL: http://backend-core:8000
      APP_ENV: production
      AUTH_SERVICE_URL: http://auth-service:8010
      BACKEND_URL: http://backend-core:8000
      CORS_ALLOW_ORIGINS: ${APP_PUBLIC_URL:?Required}
      KEYCLOAK_AUDIENCE: hsaai-api
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hsaai-frontend}
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: hsaai
      LLM_GATEWAY_URL: http://llm-gateway:8090
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      RAG_ENGINE_URL: http://rag-service:8030
      REDIS_URL: redis://redis:6379/3
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?Required}
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - hsaai_private
    ports:
    - 127.0.0.1:8000:8000
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    cap_drop:
    - ALL
    depends_on:
    - keycloak
    - postgres
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      APP_ENV: production
      AUTH_SERVICE_URL: http://auth-service:8010
      DATABASE_URL: postgresql://hsaai_app:${APP_DB_PASSWORD:?Required}@postgres:5432/hsaai
      JWT_SECRET: ${JWT_SECRET:?Required}
      KEYCLOAK_AUDIENCE: hsaai-api
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      REDIS_URL: redis://redis:6379/0
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - hsaai_private
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
  backend-core:
    build:
      context: .
      dockerfile: services/backend_core/Dockerfile
    cap_drop:
    - ALL
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      db-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Required}
      ENCRYPTION_SALT_PATH: /data/encryption.salt
      FIELD_ENCRYPTION_ENABLED: 'true'
      DEBUG: 'false'
      ALLOW_DEV_RBAC: 'false'
      APP_ENV: production
      AUTH_REQUIRED: 'true'
      AUTH_SERVICE_URL: http://auth-service:8010
      CORS_ALLOW_ORIGINS: ${APP_PUBLIC_URL:?Required}
      DATABASE_URL: postgresql+psycopg://hsaai_app:${APP_DB_PASSWORD:?Required}@postgres:5432/hsaai
      KEYCLOAK_AUDIENCE: hsaai-api
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_URL: http://keycloak:8080
      LLM_GATEWAY_URL: http://llm-gateway:8090
      LOCAL_FILE_STORAGE: /data/local_uploads
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QDRANT_URL: http://qdrant:6333
      RAG_ENGINE_URL: http://rag-service:8030
      RAG_EVENT_DB: /data/rag_events.db
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_PROVIDER: sentence-transformers
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      RAG_ANSWER_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b-instruct}
      RUN_MIGRATIONS_ON_STARTUP: 'false'
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?Required}
    healthcheck:
      interval: 30s
      retries: 3
      start_period: 20s
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      timeout: 5s
    logging:
      driver: json-file
      options:
        max-file: '3'
        max-size: 10m
    networks:
    - hsaai_private
    ports:
    - 127.0.0.1:8001:8000
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    volumes:
    - documents_data:/data
