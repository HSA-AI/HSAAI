version: '3.9'
services:
  ollama:
    image: ollama/ollama:0.4.7
    ports:
    - 127.0.0.1:11434:11434
    volumes:
    - ollama_data:/root/.ollama
    restart: unless-stopped
  llm-gateway:
    build:
      context: .
      dockerfile: services/llm_gateway/Dockerfile
    ports:
    - 127.0.0.1:8090:8090
    environment:
      LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b-instruct}
      INTERNAL_ONLY_MODE: ${INTERNAL_ONLY_MODE:-true}
      REDIS_URL: redis://redis:6379/1
      TOKEN_BUDGET_REDIS_URL: redis://redis:6379/2
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AUTH_SERVICE_URL: http://auth-service:8010
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: hsaai-api
      APP_ENV: ${HSAAI_APP_ENV:-development}
    depends_on:
    - redis
    - otel-collector
    - ollama
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
    - default
    - hsaai_private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: hsaai
      POSTGRES_USER: ${POSTGRES_USER:-hsaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
    - 127.0.0.1:5432:5432
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-hsaai} -d hsaai
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
    - 127.0.0.1:6333:6333
    - 127.0.0.1:6334:6334
    volumes:
    - qdrant_data:/qdrant/storage
    environment:
    - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
  neo4j:
    image: neo4j:5
    ports:
    - 127.0.0.1:7474:7474
    - 127.0.0.1:7687:7687
    environment:
    - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
    - NEO4J_PLUGINS=["apoc"]
    volumes:
    - neo4j_data:/data
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports:
    - 127.0.0.1:6379:6379
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
    - redis_data:/data
    restart: unless-stopped
    networks:
    - default
    - hsaai_private
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    ports:
    - 127.0.0.1:9092:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: hsaaiKafkaCluster2026x
    volumes:
    - kafka_data:/var/lib/kafka/data
    restart: unless-stopped
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.110.0
    ports:
    - 4317:4317
    - 4318:4318
    volumes:
    - ./infrastructure/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml
    command:
    - --config=/etc/otelcol/config.yaml
    depends_on:
    - tempo
    - loki
    restart: unless-stopped
  tempo:
    image: grafana/tempo:2.6.0
    ports:
    - 127.0.0.1:3200:3200
    - 127.0.0.1:14250:14250
    volumes:
    - tempo_data:/var/tempo
    restart: unless-stopped
  loki:
    image: grafana/loki:3.3.2
    ports:
    - 127.0.0.1:3100:3100
    volumes:
    - loki_data:/loki
    restart: unless-stopped
  grafana:
    image: grafana/grafana:11.3.0
    ports:
    - 3001:3000
    environment:
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
    - grafana_data:/var/lib/grafana
    - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
    - ./infrastructure/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
    - tempo
    - loki
    - prometheus
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
    - 127.0.0.1:9090:9090
    volumes:
    - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    - ./infrastructure/monitoring/rules:/etc/prometheus/rules:ro
    - prometheus_data:/prometheus
    restart: unless-stopped
  thanos-sidecar:
    image: thanosio/thanos:v0.37.0
    container_name: hsaai-thanos-sidecar
    command:
    - sidecar
    - --tsdb.path=/prometheus
    - --prometheus.url=http://prometheus:9090
    - --objstore.config-file=/etc/thanos/objstore.yml
    - --http-address=0.0.0.0:10902
    - --grpc-address=0.0.0.0:10901
    volumes:
    - prometheus_data:/prometheus:ro
    - ./infrastructure/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
    depends_on:
    - prometheus
    - minio
    ports:
    - 127.0.0.1:10902:10902
    restart: unless-stopped
  thanos-store:
    image: thanosio/thanos:v0.37.0
    container_name: hsaai-thanos-store
    command:
    - store
    - --data-dir=/data
    - --objstore.config-file=/etc/thanos/objstore.yml
    - --http-address=0.0.0.0:10902
    - --grpc-address=0.0.0.0:10901
    volumes:
    - thanos_store_data:/data
    - ./infrastructure/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
    depends_on:
    - minio
    ports:
    - 127.0.0.1:10912:10902
    restart: unless-stopped
  thanos-query:
    image: thanosio/thanos:v0.37.0
    container_name: hsaai-thanos-query
    command:
    - query
    - --http-address=0.0.0.0:10902
    - --grpc-address=0.0.0.0:10901
    - --store=thanos-sidecar:10901
    - --store=thanos-store:10901
    - --query.replica-label=prometheus_replica
    depends_on:
    - thanos-sidecar
    - thanos-store
    ports:
    - 127.0.0.1:10922:10902
    restart: unless-stopped
  thanos-compactor:
    image: thanosio/thanos:v0.37.0
    container_name: hsaai-thanos-compactor
    command:
    - compact
    - --data-dir=/data
    - --objstore.config-file=/etc/thanos/objstore.yml
    - --http-address=0.0.0.0:10902
    - --retention.resolution-raw=365d
    - --retention.resolution-5m=730d
    - --retention.resolution-1h=1825d
    volumes:
    - thanos_compactor_data:/data
    - ./infrastructure/thanos/objstore.yml:/etc/thanos/objstore.yml:ro
    depends_on:
    - minio
    restart: unless-stopped
  thanos-ruler:
    image: thanosio/thanos:v0.37.0
    container_name: hsaai-thanos-ruler
    command:
    - rule
    - --data-dir=/data
    - --eval-interval=30s
    - --rule-file=/etc/thanos/rules/*.yml
    - --alertmanagers.url=http://alertmanager:9093
    - --query=thanos-query:10902
    - --http-address=0.0.0.0:10902
    - --grpc-address=0.0.0.0:10901
    volumes:
    - thanos_ruler_data:/data
    - ./infrastructure/thanos/rules:/etc/thanos/rules:ro
    depends_on:
    - thanos-query
    restart: unless-stopped
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.18.0
    container_name: hsaai-mlflow
    ports:
    - 127.0.0.1:5000:5000
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://hsaai:${POSTGRES_PASSWORD:?Required}@postgres:5432/mlflow
      MLFLOW_DEFAULT_ARTIFACT_ROOT: s3://hsaai-models/
      AWS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-hsaai_minio_admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Required}
      AWS_REGION: us-east-1
      MLFLOW_S3_IGNORE_TLS: 'true'
    command: 'mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri "postgresql://hsaai:${POSTGRES_PASSWORD:?Required}@postgres:5432/mlflow"
      --default-artifact-root s3://hsaai-models/ --serve-artifacts

      '
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5000/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: hsaai-minio
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hsaai_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Required set MINIO_ROOT_PASSWORD
        env var}
      MINIO_BROWSER: 'on'
    command: server /data --console-address ":9001"
    volumes:
    - minio_data:/data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
  minio-init:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    container_name: hsaai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
    - -c
    - 'set -e

      mc alias set hsaai http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"

      mc mb --ignore-existing hsaai/hsaai-documents

      mc mb --ignore-existing hsaai/hsaai-models

      mc mb --ignore-existing hsaai/hsaai-backups

      mc mb --ignore-existing hsaai/hsaai-audit-logs

      # Lifecycle: move objects to GLACIER after 90 days, expire after 365 days.

      mc ilm add --expire-days 365 hsaai/hsaai-documents || true

      mc ilm add --transition-days 90 --transition-tier GLACIER hsaai/hsaai-documents
      || true

      echo "MinIO buckets created: hsaai-documents, hsaai-models, hsaai-backups, hsaai-audit-logs"

      '
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-hsaai_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Required set MINIO_ROOT_PASSWORD
        env var}
    restart: 'no'
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    ports:
    - 8080:8080
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-hsaai}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
    command:
    - start
    - --import-realm
    - --hostname=${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
    - --hostname-backchannel-dynamic=true
    - --proxy-headers=xforwarded
    volumes:
    - keycloak_data:/opt/keycloak/data
    - ./infrastructure/keycloak/hsaai-realm.json:/opt/keycloak/data/import/hsaai-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  vault:
    image: hashicorp/vault:1.16.0
    ports:
    - 127.0.0.1:8200:8200
    cap_add:
    - IPC_LOCK
    command: server
    volumes:
    - ./infrastructure/vault/vault.hcl:/vault/config/vault.hcl:ro
    - vault_data:/vault/data
    - vault_audit:/vault/audit
    environment:
      VAULT_LOCAL_CONFIG: 'ui = true

        disable_mlock = false'
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - vault
      - status
      interval: 30s
      timeout: 5s
      retries: 3
  opa:
    image: openpolicyagent/opa:0.68.0-static
    ports:
    - 127.0.0.1:8181:8181
    command: run --server /policies
    volumes:
    - ./infrastructure/opa/policies:/policies
    restart: unless-stopped
  web:
    build: apps/web
    ports:
    - 3000:3000
    environment:
      NODE_ENV: production
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: hsaai-api
      KEYCLOAK_REALM: hsaai
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hsaai-frontend}
      NEXT_PUBLIC_KEYCLOAK_REALM: hsaai
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hsaai-frontend}
      SESSION_SECRET: ${SESSION_SECRET:?Required set SESSION_SECRET}
      BACKEND_URL: http://backend-core:8000
      AUTH_SERVICE_URL: http://auth-service:8010
      API_GATEWAY_URL: http://api-gateway:8000
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      HSAAI_COOKIE_SECURE: ${HSAAI_COOKIE_SECURE:-false}
    depends_on:
      backend-core:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 1G
  api-gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    ports:
    - 127.0.0.1:8000:8000
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8090
      BACKEND_URL: http://backend-core:8000
      RAG_ENGINE_URL: http://rag-service:8030
      AUTH_SERVICE_URL: http://auth-service:8010
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_REALM: hsaai
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hsaai-frontend}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: hsaai-api
      APP_ENV: ${HSAAI_APP_ENV:-development}
      AI_ORCHESTRATOR_URL: http://agent-runtime:8040
      ANALYTICS_URL: http://backend-core:8000
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      REDIS_URL: redis://redis:6379/3
    depends_on:
    - llm-gateway
    - auth-service
    - rag-service
    - backend-core
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
    - default
    - hsaai_private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: hsaai-api
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-hsaai}:${POSTGRES_PASSWORD}@postgres:5432/hsaai
      AUTH_SERVICE_URL: http://auth-service:8010
      APP_ENV: ${HSAAI_APP_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:?Required}
    depends_on:
    - keycloak
    - postgres
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
    - default
    - hsaai_private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  rag-service:
    build:
      context: .
      dockerfile: services/rag_engine/Dockerfile
    environment:
      QDRANT_URL: http://qdrant:6333
      LLM_GATEWAY_URL: http://llm-gateway:8090
      NEO4J_URL: bolt://neo4j:7687
      AUTH_SERVICE_URL: http://auth-service:8010
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: hsaai-api
      APP_ENV: ${HSAAI_APP_ENV:-development}
      LOCAL_FILE_STORAGE: /data/local_uploads
      RAG_EVENT_DB: /data/rag_events.db
      EMBEDDING_PROVIDER: sentence-transformers
      OLLAMA_BASE_URL: http://ollama:11434
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      RAG_ANSWER_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:7b-instruct}
      HF_HOME: /models
    depends_on:
    - qdrant
    - neo4j
    - llm-gateway
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
    - default
    - hsaai_private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    volumes:
    - documents_data:/data
    - embedding_models:/models
  agent-runtime:
    build:
      context: .
      dockerfile: services/multi_agents/Dockerfile
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8090
      RAG_ENGINE_URL: http://rag-service:8030
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://redis:6379/0
      AUTH_SERVICE_URL: http://auth-service:8010
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: hsaai-api
      APP_ENV: ${HSAAI_APP_ENV:-development}
    depends_on:
    - llm-gateway
    - rag-service
    - kafka
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          pids: 256
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
    - default
    - hsaai_private
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  alignment-service:
    build:
      context: .
      dockerfile: services/ai_alignment/Dockerfile
    environment:
      LLM_GATEWAY_URL: http://llm-gateway:8090
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      SAFETY_REDIS_URL: redis://redis:6379/3
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      AUTH_SERVICE_URL: http://auth-service:8010
      KEYCLOAK_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}/realms/hsaai
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/hsaai/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: hsaai-api
      APP_ENV: ${HSAAI_APP_ENV:-development}
    depends_on:
    - llm-gateway
    - redis
    ports:
    - 127.0.0.1:8005:8005
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8005/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    deploy:
