# Tool registry — Executive Agent
apiVersion: hsaaiv2/v1
kind: AgentTools
metadata:
  name: executive-agent-tools
spec:
  agentId: AGENT-EXEC
  tools:
    - id: rag_search
      enabled: true
      audit: true
      human_approval: false
    - id: knowledge_graph_query
      enabled: true
      audit: true
      human_approval: false
    - id: power_bi_query
      enabled: true
      audit: true
      human_approval: false
    - id: executive_dashboard
      enabled: true
      audit: true
      human_approval: false
    - id: approve_workflow
      enabled: true
      audit: true
      human_approval: true
  defaultTimeout: 30s
  retryPolicy:
    maxRetries: 2
    backoff: exponential
