# Tool registry — Executive Assistant
apiVersion: hsaaiv2/v1
kind: AgentTools
metadata:
  name: executive-assistant-tools
spec:
  agentId: AGENT-EXEC-ASSISTANT
  tools:
    - id: rag_search
      enabled: true
      audit: true
      human_approval: false
    - id: m365_calendar
      enabled: true
      audit: true
      human_approval: false
    - id: m365_email
      enabled: true
      audit: true
      human_approval: false
    - id: teams_notify
      enabled: true
      audit: true
      human_approval: false
    - id: sharepoint_query
      enabled: true
      audit: true
      human_approval: false
  defaultTimeout: 30s
  retryPolicy:
    maxRetries: 2
    backoff: exponential
