# Tool registry — Logistics Agent
apiVersion: hsaaiv2/v1
kind: AgentTools
metadata:
  name: logistics-agent-tools
spec:
  agentId: AGENT-LOGISTICS
  tools:
    - id: rag_search
      enabled: true
      audit: true
      human_approval: false
    - id: tms_query
      enabled: true
      audit: true
      human_approval: false
    - id: kafka_consume
      enabled: true
      audit: true
      human_approval: false
    - id: create_shipment
      enabled: true
      audit: true
      human_approval: true
  defaultTimeout: 30s
  retryPolicy:
    maxRetries: 2
    backoff: exponential
