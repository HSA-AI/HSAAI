# Tool registry — Legal Agent
apiVersion: hsaaiv2/v1
kind: AgentTools
metadata:
  name: legal-agent-tools
spec:
  agentId: AGENT-LEGAL
  tools:
    - id: rag_search
      enabled: true
      audit: true
      human_approval: false
    - id: knowledge_graph_query
      enabled: true
      audit: true
      human_approval: false
    - id: sharepoint_query
      enabled: true
      audit: true
      human_approval: false
    - id: approve_contract
      enabled: true
      audit: true
      human_approval: true
  defaultTimeout: 30s
  retryPolicy:
    maxRetries: 2
    backoff: exponential
