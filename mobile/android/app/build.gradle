apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()

static def versionToNumber(major, minor, patch) {
  return patch * 100 + minor * 10000 + major * 1000000
}

def getRNVersion() {
  def version = providers.exec {
    workingDir(projectDir)
    commandLine("node", "-e", "console.log(require('react-native/package.json').version);")
  }.standardOutput.asText.get().trim()

  def coreVersion = version.split("-")[0]
  def (major, minor, patch) = coreVersion.tokenize('.').collect { it.toInteger() }

  return versionToNumber(
      major,
      minor,
      patch
  )
}
def rnVersion = getRNVersion()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()
    hermesCommand = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(["node", "--print", "require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim()).getParentFile().getAbsoluteFile()

    // Use Expo CLI to bundle the app, this ensures the Metro config
    // works correctly with Expo projects.
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"

    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]

    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    if (rnVersion >= versionToNumber(0, 75, 0)) {
        /* Autolinking */
        autolinkLibrariesWithApp()
    }
}

/**
 * OWASP MASVS-RESILIENCE-9: ProGuard / R8 is now ALWAYS enabled for release
 * builds (hard-coded `minifyEnabled true` in the release build type below).
 * The legacy `android.enableProguardInReleaseBuilds` gradle.properties flag
 * is intentionally ignored — shipping an unminified release APK is a security
 * anti-pattern and must not be a one-line toggle.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion

    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.hsa.hsaai'
    defaultConfig {
        applicationId 'com.hsa.hsaai'

        // ── OWASP MASVS-NETWORK-1 / MASVS-RESILIENCE-1 ─────────────────────────
        // minSdkVersion 24 (Android 7.0) is REQUIRED for the networkSecurityConfig
        // attribute to be honored — older Android versions ignore it and would
        // silently fall back to cleartext-allowed. Network Security Config also
        // brings in the system Trust Manager improvements (per-domain pinning).
        // If gradle.properties ext.minSdkVersion < 24, fail the build rather than
        // silently degrading security.
        def extMinSdk = rootProject.ext.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        minSdkVersion Math.max(extMinSdk.toInteger(), 24)

        // targetSdkVersion 34 (Android 14) enforces the newest platform security
        // hardening: scoped storage, foreground service types, notification runtime
        // permission, restricted Background activity launches (BAL — mitigates
        // task hijacking). Per Google Play policy, targetSdkVersion must be within
        // one year of the latest Android release.
        def extTargetSdk = rootProject.ext.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
        targetSdkVersion Math.max(extTargetSdk.toInteger(), 34)

        versionCode 1
        versionName "6.1.0"
    }

    // ── OWASP MASVS-RESILIENCE-1 / MASVS-CRYPTO-1 ────────────────────────────
    // RELEASE SIGNING CONFIG
    // ---------------------------------------------------------------------
    // In production the release keystore MUST be provisioned OUT-OF-BAND via
    // environment variables — never checked into VCS. The debug.keystore is
    // only used as a fallback so local `expo run:android` builds still work
    // without manual setup.
    //
    // Provisioning steps for a release build:
    //   1. Generate a 10,000-iteration PBKDF2 keystore:
    //        keytool -genkeypair -v -keystore hsaai-release.keystore \
    //          -alias hsaai -keyalg RSA -keysize 4096 -validity 10000 \
    //          -sigalg SHA256withRSA
    //   2. Export credentials via CI environment variables:
    //        export HSAAI_UPLOAD_STORE_FILE=/secure/hsaai-release.keystore
    //        export HSAAI_UPLOAD_STORE_PASSWORD=********
    //        export HSAAI_UPLOAD_KEY_ALIAS=hsaai
    //        export HSAAI_UPLOAD_KEY_PASSWORD=********
    //   3. Build: ./gradlew assembleRelease
    //   4. (Recommended) Enroll in Google Play App Signing so Google re-signs
    //      with a per-app key and your upload key can be rotated if leaked.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty('HSAAI_UPLOAD_STORE_FILE')) {
                storeFile file(project.findProperty('HSAAI_UPLOAD_STORE_FILE') as String)
                storePassword project.findProperty('HSAAI_UPLOAD_STORE_PASSWORD') as String
                keyAlias project.findProperty('HSAAI_UPLOAD_KEY_ALIAS') as String
                keyPassword project.findProperty('HSAAI_UPLOAD_KEY_PASSWORD') as String
            } else {
                // Fallback for local dev builds. CI MUST inject the env vars above
                // to prevent shipping an APK signed with the public debug key.
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            // MASVS-RESILIENCE-1: debug builds are explicitly marked debuggable
            // (Manifest merges android:debuggable=true from this build type).
            signingConfig signingConfigs.debug
            // Dev-only: allow cleartext to localhost for Metro bundler.
            // (network_security_config.xml permits only 10.0.2.2/localhost/127.0.0.1.)
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // MASVS-RESILIENCE-1 / MASVS-RESILIENCE-7: production APK is signed
            // with the release keystore and stripped of all dev tooling.
            signingConfig signingConfigs.release

            // ── R8 / ProGuard ──────────────────────────────────────────────────
            // MASVS-RESILIENCE-9: code shrinking + obfuscation makes reverse
            // engineering materially harder. The release build MUST enable both
            // minifyEnabled AND shrinkResources — anything less leaves string
            // literals, class names, and unused code paths visible in APKTool.
            // Hard-coded `true` (rather than the prior gradle.properties flag)
            // ensures a release build CANNOT ship unminified by accident.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            crunchPngs (findProperty('android.enablePngCrunchInReleaseBuilds')?.toBoolean() ?: true)
        }
    }

    // ── MASVS-RESILIENCE-9 ──────────────────────────────────────────────────
    // useLegacyPackaging=false (default) keeps native libraries uncompressed in
    // the APK so the Android Package Installer can page them directly from the
    // APK without extracting them to /data/app/.../lib. This reduces the
    // on-device storage footprint AND avoids shipping a /lib/ folder that
    // attackers could swap with malicious .so files on rooted devices.
    packagingOptions {
        jniLibs {
            useLegacyPackaging (findProperty('expo.useLegacyPackaging')?.toBoolean() ?: false)
        }
    }
}

// Apply static values from `gradle.properties` to the `android.packagingOptions`
// Accepts values in comma delimited lists, example:
// android.packagingOptions.pickFirsts=/LICENSE,**/picasa.ini
["pickFirsts", "excludes", "merges", "doNotStrip"].each { prop ->
    // Split option: 'foo,bar' -> ['foo', 'bar']
    def options = (findProperty("android.packagingOptions.$prop") ?: "").split(",");
    // Trim all elements in place.
    for (i in 0..<options.size()) options[i] = options[i].trim();
    // `[] - ""` is essentially `[""].filter(Boolean)` removing all empty strings.
    options -= ""

    if (options.length > 0) {
        println "android.packagingOptions.$prop += $options ($options.length)"
        // Ex: android.packagingOptions.pickFirsts += '**/SCCS/**'
        options.each {
            android.packagingOptions[prop] += it
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    def isGifEnabled = (findProperty('expo.gif.enabled') ?: "") == "true";
    def isWebpEnabled = (findProperty('expo.webp.enabled') ?: "") == "true";
    def isWebpAnimatedEnabled = (findProperty('expo.webp.animated') ?: "") == "true";

    if (isGifEnabled) {
        // For animated gif support
        implementation("com.facebook.fresco:animated-gif:${reactAndroidLibs.versions.fresco.get()}")
    }

    if (isWebpEnabled) {
        // For webp support
        implementation("com.facebook.fresco:webpsupport:${reactAndroidLibs.versions.fresco.get()}")
        if (isWebpAnimatedEnabled) {
            // Animated webp support
            implementation("com.facebook.fresco:animated-webp:${reactAndroidLibs.versions.fresco.get()}")
        }
    }

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

if (rnVersion < versionToNumber(0, 75, 0)) {
    apply from: new File(["node", "--print", "require.resolve('@react-native-community/cli-platform-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), "../native_modules.gradle");
    applyNativeModulesAppBuildGradle(project)
}
