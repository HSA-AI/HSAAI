# HSAAI Prometheus Alerting Rules (Phase 12)
# =============================================
# Deploy: kubectl apply -f alerting-rules.yaml in monitoring namespace

groups:
  # ═══════════════════════════════════════════════════════════════
  # SERVICE AVAILABILITY ALERTS
  # ═══════════════════════════════════════════════════════════════
  - name: hsaai-availability
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job="hsaai-services"} == 0
        for: 1m
        labels:
          severity: critical
          team: sre
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(hsaai_requests_total{status=~"5.."}[5m])) by (service)
          / sum(rate(hsaai_requests_total[5m])) by (service) > 0.01
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 1%)"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum(rate(hsaai_request_duration_seconds_bucket[5m])) by (le, service)
          ) > 5
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High p99 latency on {{ $labels.service }}"
          description: "p99 latency is {{ $value }}s (threshold: 5s)"

  # ═══════════════════════════════════════════════════════════════
  # LLM-SPECIFIC ALERTS
  # ═══════════════════════════════════════════════════════════════
  - name: hsaai-llm
    interval: 30s
    rules:
      - alert: LLMCacheHitRateLow
        expr: |
          sum(rate(hsaai_cache_hits_total[1h]))
          / (sum(rate(hsaai_cache_hits_total[1h])) + sum(rate(hsaai_cache_misses_total[1h]))) < 0.20
        for: 1h
        labels:
          severity: warning
          team: ai
        annotations:
          summary: "LLM cache hit rate below 20%"
          description: "Cache hit rate is {{ $value | humanizePercentage }} — cost optimization needed"

      - alert: LLMInferenceSlow
        expr: |
          histogram_quantile(0.99,
            sum(rate(hsaai_llm_duration_seconds_bucket[5m])) by (le, model)
          ) > 10
        for: 5m
        labels:
          severity: warning
          team: ai
        annotations:
          summary: "LLM inference p99 > 10s for model {{ $labels.model }}"

      - alert: LLMTokenBudgetExhausted
        expr: hsaai_llm_tokens_total{tenant_id!=""} > 1000000
        for: 1m
        labels:
          severity: warning
          team: governance
        annotations:
          summary: "Tenant {{ $labels.tenant_id }} exceeded daily token budget"

  # ═══════════════════════════════════════════════════════════════
  # INFRASTRUCTURE ALERTS
  # ═══════════════════════════════════════════════════════════════
  - name: hsaai-infrastructure
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"

      - alert: DiskSpaceLow
        expr: |
          (1 - (node_filesystem_avail_bytes / node_filesystem_size_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
          team: sre
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"

      - alert: PostgreSQLConnectionsHigh
        expr: pg_stat_activity_count > 150
        for: 5m
        labels:
          severity: warning
          team: dba
        annotations:
          summary: "PostgreSQL connection count > 150"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          team: sre

  # ═══════════════════════════════════════════════════════════════
  # AI SAFETY ALERTS
  # ═══════════════════════════════════════════════════════════════
  - name: hsaai-safety
    interval: 30s
    rules:
      - alert: PromptInjectionBlocked
        expr: increase(hsaai_prompt_firewall_blocks_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Multiple prompt injection attempts blocked"
          description: "{{ $value }} injection attempts in 5 minutes — possible attack"

      - alert: AgentActionBlocked
        expr: increase(hsaai_safety_blocks_total[5m]) > 5
        for: 5m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Multiple agent actions blocked by safety layer"

      - alert: KillSwitchActivated
        expr: hsaai_kill_switch_active == 1
        for: 0m
        labels:
          severity: critical
          team: governance
        annotations:
          summary: "🛑 KILL SWITCH ACTIVATED — all agents halted"

      - alert: AuditLogIntegrityFailure
        expr: hsaai_audit_integrity_ok == 0
        for: 1m
        labels:
          severity: critical
          team: security
        annotations:
          summary: "Audit log integrity check failed — possible tampering"
