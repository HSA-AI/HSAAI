# Nginx load balancer for Qdrant cluster (v3.0)
# Round-robin with health checks across 3 Qdrant nodes.

events {
    worker_connections 1024;
}

http {
    # ─── Upstream: Qdrant HTTP API ───
    upstream qdrant_http {
        least_conn;
        server qdrant1:6333 max_fails=3 fail_timeout=30s;
        server qdrant2:6333 max_fails=3 fail_timeout=30s;
        server qdrant3:6333 max_fails=3 fail_timeout=30s;
    }

    # ─── Health check endpoint ───
    server {
        listen 6333;
        server_name _;

        # Active health check: only route to healthy nodes
        location / {
            proxy_pass http://qdrant_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Retry on failure
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }

        # Health endpoint (no upstream routing)
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # Cluster info (route to any node)
        location /cluster {
            proxy_pass http://qdrant_http;
        }
    }
}

# gRPC stream (Qdrant gRPC API on 6334) — requires separate config
stream {
    upstream qdrant_grpc {
        least_conn;
        server qdrant1:6334 max_fails=3 fail_timeout=30s;
        server qdrant2:6334 max_fails=3 fail_timeout=30s;
        server qdrant3:6334 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 6334;
        proxy_pass qdrant_grpc;
        proxy_connect_timeout 5s;
        proxy_timeout 60s;
    }
}
