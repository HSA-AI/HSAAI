# HSAAI Vault + Sidecar (v4.1)
# Vault server + Vault Agent sidecar for secret caching/renewal.
#
# SECURITY FIX v2.1 (P0):
#   - Removed `-dev` mode and dev root token from env vars and command
#   - Vault now runs in production server mode using vault.hcl
#   - TLS enabled (certs mounted from infrastructure/mtls/)
#   - Audit log directory mounted as a volume
#   - Init sidecar uses real AppRole auth (not dev root token)
#   - VAULT_ADDR uses https://

version: "3.8"

services:
  vault:
    image: hashicorp/vault:1.16.0
    container_name: hsaai-vault
    ports:
      - "8200:8200"
    environment:
      # FIX v2.1 (P0): No more VAULT_DEV_ROOT_TOKEN_ID or VAULT_DEV_LISTEN_ADDRESS.
      # Production Vault uses config file + Shamir unseal or transit auto-unseal.
      VAULT_LOCAL_CONFIG: "ui = true\ndisable_mlock = false"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault-data:/vault/data
      - vault-audit:/vault/audit
      - vault-tls:/vault/tls:ro
      - ./vault.hcl:/vault/config/vault.hcl:ro
    # FIX v2.1 (P0): run in server mode (not -dev). Unseal must happen via
    # `vault operator unseal` after first boot, or via transit auto-unseal
    # against a separate unseal Vault.
    command: server
    networks:
      - hsaai-private
    healthcheck:
      # Vault returns exit code 2 when sealed — that's "healthy" for our purposes
      # (the server is up, just waiting for unseal). Use a more lenient check.
      test: ["CMD", "sh", "-c", "vault status || test $? -eq 2"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Vault Init Sidecar ───
  # Runs once after Vault is unsealed to:
  #   1. Enable AppRole auth method
  #   2. Create service policy
  #   3. Create AppRole with short-lived tokens
  #   4. Enable database secrets engine (dynamic DB credentials)
  #   5. Seed static secrets (database, redis, keycloak)
  #
  # NOTE: In production, the unseal key and root token are generated by the
  # operator via `vault operator init` and stored in a secure KMS or split
  # across custodians via Shamir. The init sidecar here uses the root token
  # from VAULT_ROOT_TOKEN env var (set via external-secrets or sealed-secrets,
  # NOT committed to git).
  vault-init:
    image: hashicorp/vault:1.16.0
    container_name: hsaai-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      # FIX v2.1 (P0): Use https:// and require VAULT_ROOT_TOKEN from env.
      # In production, set this via external-secrets/sealed-secrets, not in the compose file.
      VAULT_ADDR: https://vault:8200
      VAULT_TOKEN: "${VAULT_ROOT_TOKEN:?Required set VAULT_ROOT_TOKEN env var (from external-secrets)}"
      VAULT_SKIP_VERIFY: "false"
      VAULT_CACERT: /vault/tls/ca.crt
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        # Wait for Vault to be unsealed (operator must run `vault operator unseal` first)
        echo "Waiting for Vault to be unsealed..."
        until vault status 2>/dev/null | grep -q "Sealed.*false"; do
          sleep 5
        done
        echo "Vault is unsealed. Proceeding with init..."

        # Enable audit logging to file (required for ISO 27001 A.8.15)
        vault audit enable file file_path=/vault/audit/audit.log

        # Enable AppRole auth
        vault auth enable approle

        # Create policy for HSAAI services
        vault policy write hsaai-service - <<'POLICY'
        path "secret/data/hsaai/*" {
          capabilities = ["read"]
        }
        path "database/creds/hsaai-app" {
          capabilities = ["read"]
        }
        path "auth/token/renew-self" {
          capabilities = ["update"]
        }
        POLICY

        # Create AppRole
        vault write auth/approle/role/hsaai-service \
          secret_id_ttl=24h \
          token_ttl=1h \
          token_max_ttl=4h \
          secret_id_num_uses=0 \
          policies=hsaai-service

        # Output role_id and secret_id for services to use
        ROLE_ID=$$(vault read -field=role_id auth/approle/role/hsaai-service/role-id)
        SECRET_ID=$$(vault write -f -field=secret_id auth/approle/role/hsaai-service/secret-id)
        echo "VAULT_ROLE_ID=$$ROLE_ID" > /vault/config/approle.env
        echo "VAULT_SECRET_ID=$$SECRET_ID" >> /vault/config/approle.env
        echo "AppRole configured successfully!"

        # Enable database secrets engine (dynamic credentials)
        vault secrets enable database

        # Configure PostgreSQL connection
        vault write database/config/hsaai-postgres \
          plugin_name=postgresql-database-plugin \
          allowed_roles="hsaai-app" \
          connection_url="postgresql://{{username}}:{{password}}@postgres:5432/hsaai?sslmode=disable" \
          username="hsaai" \
          password="${POSTGRES_PASSWORD:?Required set POSTGRES_PASSWORD env var}"

        # Create role with 1-hour credentials
        vault write database/roles/hsaai-app \
          db_name=hsaai-postgres \
          creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}'; GRANT SELECT ON ALL TABLES IN SCHEMA public TO \"{{name}}\";" \
          default_ttl="1h" \
          max_ttl="4h"

        # Seed static secrets
        vault kv put secret/hsaai/database \
          username="hsaai" \
          password="${POSTGRES_PASSWORD:?Required set POSTGRES_PASSWORD env var}" \
          url="postgresql+psycopg://hsaai@postgres:5432/hsaai"

        vault kv put secret/hsaai/redis \
          password="${REDIS_PASSWORD:?Required set REDIS_PASSWORD env var}"

        vault kv put secret/hsaai/keycloak \
          client_secret="${KEYCLOAK_CLIENT_SECRET:?Required set KEYCLOAK_CLIENT_SECRET env var}" \
          admin_password="${KEYCLOAK_ADMIN_PASSWORD:?Required set KEYCLOAK_ADMIN_PASSWORD env var}"

        echo "Vault initialization complete!"
        sleep infinity
    volumes:
      - vault-config:/vault/config
      - vault-tls:/vault/tls:ro
    networks:
      - hsaai-private

volumes:
  vault-data:
  vault-audit:
  vault-config:
  vault-tls:

networks:
  hsaai-private:
    external: true
    name: hsaai_private
