server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push
    backoff_config:
      min_period: 500ms
      max_period: 5m
      max_retries: 10
    batchsize: 1048576  # 1MB
    batchwait: 1s
    tenant_id: hsaai

scrape_configs:

  # ─── HSAAI Backend Core logs ───
  - job_name: hsaai-backend-core
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["hsaai-backend"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: service
        regex: '/(.*)'
        replacement: 'backend_core'
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d+) (?P<level>\w+) (?P<logger>\S+): (?P<message>.*)'
      - labels:
          level:
          logger:
      - timestamp:
          source: timestamp
          format: '2006-01-02 15:04:05,000'
          location: UTC

  # ─── Auth Service logs ───
  - job_name: hsaai-auth-service
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["hsaai-auth-service"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: service
        regex: '/(.*)'
        replacement: 'auth_service'

  # ─── RAG Engine logs ───
  - job_name: hsaai-rag-engine
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["hsaai-rag-engine"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: service
        regex: '/(.*)'
        replacement: 'rag_engine'

  # ─── LLM Gateway logs ───
  - job_name: hsaai-llm-gateway
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["hsaai-llm-gateway"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: service
        regex: '/(.*)'
        replacement: 'llm_gateway'

  # ─── All other HSAAI services ───
  - job_name: hsaai-all-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["hsaai-*"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: service
        regex: '/hsaai-(.*)'
        replacement: '${1}'
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
    pipeline_stages:
      - match:
          selector: '{service=~".*"}'
          stages:
            - regex:
                expression: '(?P<level>(?i)(DEBUG|INFO|WARNING|ERROR|CRITICAL))'
            - labels:
                level:

  # ─── System logs (Nginx, Keycloak, etc.) ───
  - job_name: system-services
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["hsaai-nginx", "hsaai-keycloak", "hsaai-postgres*", "hsaai-redis*", "hsaai-qdrant*"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        target_label: service
        regex: '/hsaai-(.*)'
        replacement: '${1}'

limits_config:
  readline_rate_enabled: true
  readline_rate: 10000
  readline_burst: 10000
