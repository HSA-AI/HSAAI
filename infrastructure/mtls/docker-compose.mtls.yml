      MTLS_CERT_PATH: /certs/tls.crt
      MTLS_KEY_PATH: /certs/tls.key

  frontend:
    volumes:
      - ./certs/services/frontend:/certs:ro
      - ./certs/ca:/certs/ca:ro
    environment:
      MTLS_ENABLED: "true"
      MTLS_CERTS_DIR: /certs
      MTLS_CA_PATH: /certs/ca/trust-bundle.crt
      MTLS_CERT_PATH: /certs/tls.crt
      MTLS_KEY_PATH: /certs/tls.key
