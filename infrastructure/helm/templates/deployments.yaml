{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: hsaai
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    helm.sh/chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  replicas: {{ $svc.replicas | default 2 }}
  {{- if or (eq $name "rag-service") (eq $name "agent-runtime") }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/part-of: hsaai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: hsaai
    spec:
      automountServiceAccountToken: false
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      {{- with $svc.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag | default "latest" }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: {{ $svc.port }}
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ $.Values.existingSecret }}
          env:
            {{- range $key, $val := $.Values.commonEnv }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- range $secret := $svc.envFromSecret }}
            - name: {{ $secret.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret.secretName }}
                  key: {{ $secret.key }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/health" }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $svc.readyPath | default "/health" }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: {{ $svc.healthPath | default "/health" }}
              port: http
            periodSeconds: 10
            failureThreshold: 30  # allow up to 5 minutes for slow LLM warmup
          resources:
            {{- toYaml ($svc.resources | default $.Values.global.defaultResources) | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # set true in production after /tmp volume mount
            capabilities:
              drop: ["ALL"]
          {{- if or (eq $name "rag-service") (eq $name "backend-core") }}
          volumeMounts:
            - name: documents
              mountPath: /data
            {{- if eq $name "rag-service" }}
            - name: embedding-models
              mountPath: /models
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (eq $name "rag-service") (eq $name "backend-core") }}
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: {{ $.Values.documentsClaim }}
        {{- if eq $name "rag-service" }}
        - name: embedding-models
          persistentVolumeClaim:
            claimName: {{ $.Values.embeddingModelsClaim }}
        {{- end }}
      {{- end }}
      {{- with $svc.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $svc.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: {{ $name }}
{{- end }}
{{- end }}
