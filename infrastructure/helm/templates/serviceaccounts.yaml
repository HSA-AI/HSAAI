{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: hsaai
  {{- if $.Values.global.imagePullSecrets }}
  imagePullSecrets:
    {{- range $.Values.global.imagePullSecrets }}
    - name: {{ . }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
