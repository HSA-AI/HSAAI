# PgBouncer configuration (v3.0) — transaction-mode pooling for HSAAI

[databases]
; HSAAI primary database — routed through HAProxy to Patroni leader
hsaai = host=haproxy port=5430 dbname=hsaai user=hsaai password=${POSTGRES_PASSWORD} pool_size=50
; Read-only replica — for analytics queries
hsaai_ro = host=haproxy port=5431 dbname=hsaai user=hsaai password=${POSTGRES_PASSWORD} pool_size=25
; Keycloak database
keycloak = host=haproxy port=5430 dbname=keycloak user=keycloak password=${KEYCLOAK_DB_PASSWORD} pool_size=20

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; Pool mode: transaction is best for FastAPI (short-lived request-scoped transactions)
pool_mode = transaction

; Pool sizes
max_client_conn = 500
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 100
max_user_connections = 100

; Timeouts (seconds)
server_idle_timeout = 240
server_lifetime = 3600
query_wait_timeout = 120
client_idle_timeout = 0
query_timeout = 0

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

; Performance
server_reset_query = DISCARD ALL
server_reset_query_always = 0
server_check_query = select 1
server_check_delay = 10
ignore_startup_parameters = extra_float_digits,search_path,application_name

; Security
admin_users = pgbouncer_admin
stats_users = pgbouncer_stats

; File paths
pidfile = /var/run/pgbouncer/pgbouncer.pid
logfile = /var/log/pgbouncer/pgbouncer.log
