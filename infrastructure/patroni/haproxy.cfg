# HAProxy configuration for Patroni read/write split (v3.0)

global
    log stdout format raw local0
    maxconn 1000
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout queue    5s

# ─── Patroni REST API health checks ───
frontend patroni_health
    bind *:8008
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    default_backend patroni_nodes

backend patroni_nodes
    mode http
    option httpchk GET /health
    http-check expect status 200
    server patroni1 patroni1:8008 check
    server patroni2 patroni2:8008 check
    server patroni3 patroni3:8008 check

# ─── PostgreSQL Write (leader only) ───
# Routes to the Patroni leader (the node that returns 200 on /write)
frontend pg_write
    bind *:5430
    default_backend pg_leader

backend pg_leader
    mode tcp
    option httpchk GET /write
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# ─── PostgreSQL Read (leader + replicas — round robin) ───
frontend pg_read
    bind *:5431
    default_backend pg_read_pool

backend pg_read_pool
    mode tcp
    balance roundrobin
    option httpchk GET /read
    http-check expect status 200
    default-server inter 3s fall 3 rise 2
    server patroni1 patroni1:5432 check port 8008
    server patroni2 patroni2:5432 check port 8008
    server patroni3 patroni3:5432 check port 8008

# ─── Stats endpoint ───
frontend stats
    bind *:8404
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s
