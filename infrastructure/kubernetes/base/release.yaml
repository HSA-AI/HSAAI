apiVersion: v1
kind: Namespace
metadata:
  name: hsaai
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hsaai-config
data:
  APP_ENV: production
  AUTH_SERVICE_URL: http://auth-service:8010
  BACKEND_URL: http://backend-core:8000
  BACKEND_CORE_URL: http://backend-core:8000
  RAG_ENGINE_URL: http://rag-service:8030
  LLM_GATEWAY_URL: http://llm-gateway:8090
  AI_ORCHESTRATOR_URL: http://agent-runtime:8040
  ANALYTICS_URL: http://backend-core:8000
  API_GATEWAY_URL: http://api-gateway:8000
  KEYCLOAK_URL: http://keycloak.hsaai-data.svc.cluster.local:8080
  KEYCLOAK_INTERNAL_URL: http://keycloak.hsaai-data.svc.cluster.local:8080
  KEYCLOAK_JWKS_URL: http://keycloak.hsaai-data.svc.cluster.local:8080/realms/hsaai/protocol/openid-connect/certs
  KEYCLOAK_ISSUER: https://identity.hsaai.example/realms/hsaai
  KEYCLOAK_AUDIENCE: hsaai-api
  KEYCLOAK_CLIENT_ID: hsaai-frontend
  KEYCLOAK_REALM: hsaai
  APP_PUBLIC_URL: https://ai.hsaai.example
  CORS_ALLOW_ORIGINS: https://ai.hsaai.example
  HSAAI_COOKIE_SECURE: 'true'
  INTERNAL_ONLY_MODE: 'true'
  ALLOW_EXTERNAL_AI: 'false'
  ALLOW_EXTERNAL_APIS: 'false'
  QDRANT_URL: http://qdrant.hsaai-data.svc.cluster.local:6333
  OLLAMA_BASE_URL: http://ollama.hsaai-data.svc.cluster.local:11434
  LOCAL_LLM_MODEL: qwen2.5:7b-instruct
  EMBEDDING_PROVIDER: sentence-transformers
  EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
  LOCAL_FILE_STORAGE: /data/local_uploads
  RAG_EVENT_DB: /data/rag_events.db
  AUTH_REQUIRED: 'true'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.hsaai-data.svc.cluster.local:4317
  USE_ALEMBIC: 'true'
  RUN_MIGRATIONS_ON_STARTUP: 'false'
  HF_HOME: /models
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  RAG_ANSWER_MODEL: qwen2.5:7b-instruct
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: documents-data
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels: &id001
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: hsaai
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels: *id001
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
      - name: api-gateway
        image: ghcr.io/REPLACE_ORGANIZATION/hsaai-api-gateway:4.0.0-rc.2
        ports:
        - name: http
          containerPort: 8000
        envFrom:
        - configMapRef:
            name: hsaai-config
        - secretRef:
            name: hsaai-secrets
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
          timeoutSeconds: 12
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: documents-data
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: *id001
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: hsaai
  ports:
  - port: 8000
    targetPort: http
    name: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/part-of: hsaai
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
---
