# FIX I-08: This file is a TEMPLATE — do NOT apply directly.
# Was using stringData with literal "CHANGE_ME" values — fatigued operators could
# apply it and end up with "CHANGE_ME" as the actual Postgres password.
# Now uses ExternalSecret references so the file is unusable as-is.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hsaai-production-secrets
  namespace: hsaai
spec:
  secretStoreRef:
    name: hsaai-vault-backend
    kind: ClusterSecretStore
  target:
    name: hsaai-production-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: secret/hsaai/database
        property: password
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/hsaai/jwt
        property: signing_key
    - secretKey: DATA_ENCRYPTION_KEY
      remoteRef:
        key: secret/hsaai/encryption
        property: fernet_key
    - secretKey: KEYCLOAK_ADMIN_PASSWORD
      remoteRef:
        key: secret/hsaai/keycloak
        property: admin_password
    - secretKey: KEYCLOAK_CLIENT_SECRET
      remoteRef:
        key: secret/hsaai/keycloak
        property: hsaai_api_client_secret
    - secretKey: AUDIT_HMAC_SECRET
      remoteRef:
        key: secret/hsaai/audit
        property: hmac_secret
    - secretKey: NEO4J_PASSWORD
      remoteRef:
        key: secret/hsaai/neo4j
        property: password
    - secretKey: QDRANT_API_KEY
      remoteRef:
        key: secret/hsaai/qdrant
        property: api_key
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: secret/hsaai/redis
        property: password
    - secretKey: VAULT_ROOT_TOKEN
      remoteRef:
        key: secret/hsaai/vault
        property: root_token
---
# ClusterSecretStore — references Vault via Kubernetes auth (no AppRole secret on disk)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: hsaai-vault-backend
spec:
  provider:
    vault:
      server: "https://vault:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
