# HSAAI PodDisruptionBudgets (v4.1)
# SECURITY FIX v2.1 (P0): All selectors now match the actual Deployment labels
# (app: backend, app: api-gateway, etc.) instead of the non-existent hsaai-* prefixed
# labels. Previously PDBs would never select pods, providing zero protection during drains.

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: hsaai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: hsaai
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
