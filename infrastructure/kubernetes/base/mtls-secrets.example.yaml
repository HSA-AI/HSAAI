# HSAAI mTLS Kubernetes Secrets
#
# WARNING: This is an EXAMPLE file. Do NOT commit real certificates.
# Generate certificates with: ./infrastructure/mtls/generate-certs.sh
# Then create secrets with: kubectl apply -f <generated-secret>
#
# In production, use cert-manager with the HSAAI Root CA:
#   kubectl apply -f infrastructure/kubernetes/base/cert-manager-issuer.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: hsaai-ca-secret
  namespace: hsaai
type: Opaque
data:
  ca.crt: BASE64_ENCODED_CA_CERT
---
apiVersion: v1
kind: Secret
metadata:
  name: backend-core-mtls-certs
  namespace: hsaai
type: kubernetes.io/tls
data:
  ca.crt: BASE64_ENCODED_CA_CERT
  tls.crt: BASE64_ENCODED_SERVICE_CERT
  tls.key: BASE64_ENCODED_SERVICE_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-mtls-certs
  namespace: hsaai
type: kubernetes.io/tls
data:
  ca.crt: BASE64_ENCODED_CA_CERT
  tls.crt: BASE64_ENCODED_SERVICE_CERT
  tls.key: BASE64_ENCODED_SERVICE_KEY
