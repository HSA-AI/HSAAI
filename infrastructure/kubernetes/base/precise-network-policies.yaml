  egress:
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app: rag-engine
      ports:
        - protocol: TCP
          port: 8030
    - to:
        - podSelector:
            matchLabels:
              app: llm-gateway
      ports:
        - protocol: TCP
