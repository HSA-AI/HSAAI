# HSAAI Thanos Object Store Configuration (Phase 3 — Scale)
#
# FIX v2.3 (Phase 3): Thanos uploads Prometheus blocks to MinIO for
# long-term storage (12+ months). This config points to the MinIO
# bucket "hsaai-backups" under the "thanos/" prefix.

type: S3
config:
  endpoint: minio:9000
  bucket: hsaai-thanos
  prefix: thanos/
  access_key: ${MINIO_ROOT_USER}
  secret_key: ${MINIO_ROOT_PASSWORD}
  region: us-east-1
  insecure: true  # use HTTPS=false in dev (MinIO doesn't have TLS by default)
  # In production, set insecure: false and configure TLS certs.
  http_config:
    idle_conn_timeout: 90s
    response_header_timeout: 2s
    insecure_skip_verify: false
  trace:
    enable: false
  list_objects_version: "v2"
  part_size: 134217728  # 128MB multipart upload part size
