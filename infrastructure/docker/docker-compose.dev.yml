services:
  api_gateway:
    # FIX B-15: Build from project root so Dockerfile can COPY both
    # services/api_gateway/requirements.txt and packages/common/requirements.txt.
    build:
      context: ../..
      dockerfile: services/api_gateway/Dockerfile
    depends_on:
    - backend
    - auth_service
    - ai_orchestrator
    - rag_engine
    - analytics
    environment:
      AI_ORCHESTRATOR_URL: http://ai_orchestrator:8020
      ALLOW_DEV_AUTH: 'true'
      ANALYTICS_URL: http://analytics:8070
      AUTH_REQUIRED: 'false'
      AUTH_SERVICE_URL: http://auth_service:8010
      BACKEND_URL: http://backend:8000
      RAG_ENGINE_URL: http://rag_engine:8030
      RATE_LIMIT_PER_MINUTE: '120'
    ports:
    - 8080:8080
  auth_service:
    build: ./services/auth_service
    environment:
      JWT_SECRET: dev-only-64-character-local-secret-not-for-production-000000000000
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/hsaai
    ports:
    - 8010:8010
  backend:
    build: ./services/backend_core
    depends_on:
    - postgres
    - redis
    - neo4j
    environment:
      AI_ORCHESTRATOR_URL: http://ai_orchestrator:8020
      ALLOW_DEV_RBAC: 'true'
      AUTH_SERVICE_URL: http://auth_service:8010
      CHAT_USE_ORCHESTRATOR: 'true'
      CORS_ALLOW_ORIGINS: http://localhost:3000,http://localhost:8080
      GRAPH_INGESTION_ENABLED: ${GRAPH_INGESTION_ENABLED:-true}
      GRAPH_RAG_BRIDGE_ENABLED: ${GRAPH_RAG_BRIDGE_ENABLED:-true}
      JWT_SECRET: dev-only-64-character-local-secret-not-for-production-000000000000
      KNOWLEDGE_GRAPH_ENABLED: ${KNOWLEDGE_GRAPH_ENABLED:-true}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Required set NEO4J_PASSWORD env var}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      POSTGRES_DSN: postgresql+psycopg://hsaai:hsaai@postgres:5432/hsaai
      RAG_ENGINE_URL: http://rag_engine:8030
      REDIS_URL: redis://redis:6379/0
    ports:
    - 8000:8000
  elasticsearch:
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      xpack.security.enabled: 'false'
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    ports:
    - 9200:9200
    volumes:
    - es_data:/usr/share/elasticsearch/data
  frontend:
    build: ./apps/web
    depends_on:
    - api_gateway
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
    - 3000:3000
  grafana:
    image: grafana/grafana:11.1.4
    ports:
    - 3001:3000
    volumes:
    - grafana_data:/var/lib/grafana
  llm_gateway:
    build: ./services/llm_gateway
    environment:
      ALLOW_EXTERNAL_AI: ${ALLOW_EXTERNAL_AI:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      INTERNAL_ONLY_MODE: ${INTERNAL_ONLY_MODE:-true}
      LOCAL_LLM_BASE_URL: http://local_llm:11434
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen3:8b}
      OLLAMA_BASE_URL: http://local_llm:11434
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
    - 8090:8090
  local_llm:
    image: ollama/ollama:0.3.9
    ports:
    - 11434:11434
    volumes:
    - ollama_data:/root/.ollama
  multi_agents:
    # FIX B-15: Build from project root so Dockerfile can COPY both
    # services/multi_agents/requirements.txt and packages/common/requirements.txt.
    build:
      context: ../..
      dockerfile: services/multi_agents/Dockerfile
    ports:
    - 8040:8040
  neo4j:
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Required set NEO4J_PASSWORD env var}
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      interval: 20s
      retries: 10
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:7474 || exit 1
      timeout: 8s
    image: neo4j:5-community
    ports:
    - 7474:7474
    - 7687:7687
    restart: unless-stopped
    volumes:
    - neo4j_data:/data
  postgres:
    environment:
      POSTGRES_DB: hsaai
      POSTGRES_PASSWORD: hsaai
      POSTGRES_USER: hsaai
    image: postgres:16-alpine
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
    - 9090:9090
    volumes:
    - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  qdrant:
    image: qdrant/qdrant:v1.11.5
    ports:
    - 6333:6333
    volumes:
    - qdrant_data:/qdrant/storage
  rag_engine:
    build: ./services/rag_engine
    depends_on:
    - qdrant
    - elasticsearch
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      QDRANT_URL: http://qdrant:6333
    ports:
    - 8030:8030
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
  workflow_engine:
    # FIX B-15: Build from project root so Dockerfile can COPY both
    # services/workflow_engine/requirements.txt and packages/common/requirements.txt.
    build:
      context: ../..
      dockerfile: services/workflow_engine/Dockerfile
    depends_on:
    - redis
    ports:
    - 8050:8050
volumes:
  es_data: null
  grafana_data: null
  neo4j_data: {}
  ollama_data: null
  postgres_data: null
  qdrant_data: null
