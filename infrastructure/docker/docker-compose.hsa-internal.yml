name: hsaai-internal
networks:
  hsaai_intranet_edge:
    driver: bridge
  hsaai_private:
    driver: bridge
    internal: true
    ipam:
      config:
      - subnet: ${PRIVATE_NETWORK_CIDR:-172.28.0.0/16}
services:
  api_gateway:
    build: ./services/api_gateway
    depends_on:
    - backend
    - auth_service
    - ai_orchestrator
    - rag_engine
    - analytics
    environment:
      AI_ORCHESTRATOR_URL: http://ai_orchestrator:8020
      ALLOW_DEV_AUTH: 'false'
      ALLOW_EXTERNAL_AI: 'false'
      ALLOW_EXTERNAL_APIS: 'false'
      ANALYTICS_URL: http://analytics:8070
      AUTH_REQUIRED: 'true'
      AUTH_SERVICE_URL: http://auth_service:8010
      BACKEND_URL: http://backend:8000
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      INTERNAL_ONLY_MODE: 'true'
      PRIVATE_NETWORK_CIDR: ${PRIVATE_NETWORK_CIDR:-172.28.0.0/16}
      RAG_ENGINE_URL: http://rag_engine:8030
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      STRICT_EGRESS_DENY: 'true'
    networks:
    - hsaai_intranet_edge
    - hsaai_private
    ports:
    - ${INTRANET_BIND_IP:-127.0.0.1}:8080:8080
  auth_service:
    build: ./services/auth_service
    depends_on:
    - keycloak
    environment:
      ALLOW_EXTERNAL_APIS: 'false'
      INTERNAL_ONLY_MODE: 'true'
      JWT_SECRET: ${JWT_SECRET}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-hsaai-api}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-hsaai-frontend}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://keycloak:8080/realms/hsaai}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-hsaai}
    expose:
    - '8010'
    networks:
    - hsaai_private
  backend:
    build: ./services/backend_core
    depends_on:
    - postgres
    - redis
    - neo4j
    environment:
      AI_ORCHESTRATOR_URL: http://ai_orchestrator:8020
      ALLOW_DEV_RBAC: 'false'
      ALLOW_EXTERNAL_AI: 'false'
      ALLOW_EXTERNAL_APIS: 'false'
      AUDIT_LOG_ENABLED: 'true'
      AUTH_REQUIRED: 'true'
      AUTH_SERVICE_URL: http://auth_service:8010
      CHAT_USE_ORCHESTRATOR: 'true'
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
      FIELD_ENCRYPTION_ENABLED: 'true'
      GRAPH_INGESTION_ENABLED: ${GRAPH_INGESTION_ENABLED:-true}
      GRAPH_RAG_BRIDGE_ENABLED: ${GRAPH_RAG_BRIDGE_ENABLED:-true}
      INTERNAL_ONLY_MODE: 'true'
      JWT_SECRET: ${JWT_SECRET}
      KNOWLEDGE_GRAPH_ENABLED: ${KNOWLEDGE_GRAPH_ENABLED:-true}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Required set NEO4J_PASSWORD env var}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USERNAME: ${NEO4J_USERNAME:-neo4j}
      POSTGRES_DSN: postgresql+psycopg://hsaai:${POSTGRES_PASSWORD}@postgres:5432/hsaai
      PRIVATE_NETWORK_CIDR: ${PRIVATE_NETWORK_CIDR:-172.28.0.0/16}
      RAG_ENGINE_URL: http://rag_engine:8030
      REDIS_URL: redis://redis:6379/0
      STRICT_EGRESS_DENY: 'true'
    expose:
    - '8000'
    networks:
    - hsaai_private
    volumes:
    - ./storage/audit_logs:/app/storage/audit_logs
  elasticsearch:
    environment:
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?Required set ELASTIC_PASSWORD env var}"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      xpack.security.enabled: 'true'
    expose:
    - '9200'
    image: ${ELASTICSEARCH_IMAGE:-docker.elastic.co/elasticsearch/elasticsearch:8.15.0}
    networks:
    - hsaai_private
    volumes:
    - es_data:/usr/share/elasticsearch/data
  frontend:
    build: ./apps/web
    depends_on:
    - api_gateway
    environment:
      MODEL_TRAINING_SERVICE_URL: http://model_training:8090
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    networks:
    - hsaai_intranet_edge
    - hsaai_private
    ports:
    - ${INTRANET_BIND_IP:-127.0.0.1}:3000:3000
  grafana:
    expose:
    - '3000'
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.1.4}
    networks:
    - hsaai_private
    volumes:
    - grafana_data:/var/lib/grafana
  keycloak:
    command:
    - start --optimized --hostname=${DOMAIN_NAME:-localhost} --proxy-headers=xforwarded
    - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
    expose:
    - '8080'
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:25.0.6}
    networks:
    - hsaai_private
    volumes:
    - ./infrastructure/keycloak/hsaai-realm.json:/opt/keycloak/data/import/hsaai-realm.json:ro
    - keycloak_data:/opt/keycloak/data
  llm_gateway:
    build: ./services/llm_gateway
    depends_on:
    - local_llm
    environment:
      ALLOW_EXTERNAL_AI: 'false'
      ALLOW_EXTERNAL_APIS: 'false'
      INTERNAL_ONLY_MODE: 'true'
      LOCAL_LLM_BASE_URL: http://local_llm:11434
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b-instruct}
      LOCAL_LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://local_llm:11434
      PRIVATE_NETWORK_CIDR: ${PRIVATE_NETWORK_CIDR:-172.28.0.0/16}
      STRICT_EGRESS_DENY: 'true'
    expose:
    - '8090'
    networks:
    - hsaai_private
  local_llm:
    expose:
    - '11434'
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.3.9}
    networks:
    - hsaai_private
    volumes:
    - ollama_data:/root/.ollama
    - ./storage/local_models:/models
  model_training:
    build: ./services/model_training
    depends_on:
    - local_llm
    - postgres
    - redis
    environment:
      ALLOW_EXTERNAL_AI: 'false'
      ALLOW_EXTERNAL_APIS: 'false'
      DATABASE_URL: postgresql+psycopg://hsaai:${POSTGRES_PASSWORD}@postgres:5432/hsaai
      INTERNAL_ONLY_MODE: 'true'
      LOCAL_MODEL_STORAGE: /data/models
      MODEL_TRAINING_DATASET_DIR: /data/training/datasets
      MODEL_TRAINING_EXECUTION_MODE: ${MODEL_TRAINING_EXECUTION_MODE:-real}
      MODEL_TRAINING_JOBS_DIR: /data/training/jobs
      MODEL_TRAINING_OUTPUT_DIR: /data/training/outputs
      REDIS_URL: redis://redis:6379/0
      STRICT_EGRESS_DENY: 'true'
    expose:
    - '8090'
    networks:
    - hsaai_private
    volumes:
    - ./storage/local_models:/data/models
    - ./storage/model_training:/data/training
  multi_agents:
    build: ./services/multi_agents
    environment:
      ALLOW_EXTERNAL_APIS: 'false'
      INTERNAL_ONLY_MODE: 'true'
    expose:
    - '8040'
    networks:
    - hsaai_private
  neo4j:
    environment:
      NEO4J_AUTH: ${NEO4J_USERNAME:-neo4j}/${NEO4J_PASSWORD:?Required set NEO4J_PASSWORD env var}
      NEO4J_PLUGINS: '["apoc"]'
    healthcheck:
      interval: 20s
      retries: 10
      test:
      - CMD-SHELL
      - wget -qO- http://127.0.0.1:7474 || exit 1
      timeout: 8s
    image: neo4j:5-community
    ports:
    - 7474
    - 7687
    restart: unless-stopped
    volumes:
    - neo4j_data:/data
  postgres:
    environment:
      POSTGRES_DB: hsaai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: hsaai
    expose:
    - '5432'
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    networks:
    - hsaai_private
    volumes:
    - postgres_data:/var/lib/postgresql/data
  prometheus:
    expose:
    - '9090'
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    networks:
    - hsaai_private
    volumes:
    - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  qdrant:
    expose:
    - '6333'
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.11.5}
    networks:
    - hsaai_private
    volumes:
    - qdrant_data:/qdrant/storage
  rag_engine:
    build: ./services/rag_engine
    depends_on:
    - qdrant
    - elasticsearch
    environment:
      ALLOW_EXTERNAL_APIS: 'false'
      ELASTICSEARCH_URL: http://elasticsearch:9200
      INTERNAL_ONLY_MODE: 'true'
      LOCAL_STORAGE_ROOT: /data/uploads
      PRIVATE_NETWORK_CIDR: ${PRIVATE_NETWORK_CIDR:-172.28.0.0/16}
      QDRANT_URL: http://qdrant:6333
      REQUIRE_QDRANT: 'true'
      STRICT_EGRESS_DENY: 'true'
    expose:
    - '8030'
    networks:
    - hsaai_private
    volumes:
    - ./storage/local_uploads:/data/uploads
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD:?Required set REDIS_PASSWORD env var}
      --appendonly yes
    expose:
    - '6379'
    image: ${REDIS_IMAGE:-redis:7-alpine}
    networks:
    - hsaai_private
  workflow_engine:
    build: ./services/workflow_engine
    depends_on:
    - redis
    expose:
    - '8050'
    networks:
    - hsaai_private
volumes:
  es_data:
  grafana_data:
  keycloak_data:
  neo4j_data:
  postgres_data:
  qdrant_data:
  ollama_data:
  loki_data:
  promtail_data:
