# Source: hsaai-enterprise-os/templates/deployments.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-runtime
  namespace: default
  labels:
    app.kubernetes.io/name: agent-runtime
    app.kubernetes.io/part-of: hsaai
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: hsaai-enterprise-os-4.0.0-rc.2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-runtime
      app.kubernetes.io/part-of: hsaai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-runtime
        app.kubernetes.io/part-of: hsaai
    spec:
      automountServiceAccountToken: false
      serviceAccountName: agent-runtime
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent-runtime
          image: "ghcr.io/REPLACE_ORGANIZATION/hsaai-agent-runtime:4.0.0-rc.2"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8040
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: hsaai-secrets
          env:
            - name: AI_ORCHESTRATOR_URL
              value: "http://agent-runtime:8040"
            - name: ALLOW_EXTERNAL_AI
              value: "false"
            - name: ALLOW_EXTERNAL_APIS
              value: "false"
            - name: ANALYTICS_URL
              value: "http://backend-core:8000"
            - name: API_GATEWAY_URL
              value: "http://api-gateway:8000"
            - name: APP_ENV
              value: "production"
            - name: APP_PUBLIC_URL
              value: "https://ai.hsaai.example"
            - name: AUTH_REQUIRED
              value: "true"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8010"
            - name: BACKEND_CORE_URL
              value: "http://backend-core:8000"
            - name: BACKEND_URL
              value: "http://backend-core:8000"
            - name: CORS_ALLOW_ORIGINS
              value: "https://ai.hsaai.example"
            - name: EMBEDDING_MODEL
              value: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
            - name: EMBEDDING_PROVIDER
              value: "sentence-transformers"
            - name: HF_HOME
              value: "/models"
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: HSAAI_COOKIE_SECURE
              value: "true"
            - name: INTERNAL_ONLY_MODE
              value: "true"
            - name: KEYCLOAK_AUDIENCE
              value: "hsaai-api"
            - name: KEYCLOAK_CLIENT_ID
              value: "hsaai-frontend"
            - name: KEYCLOAK_INTERNAL_URL
              value: "http://keycloak.hsaai-data.svc.cluster.local:8080"
            - name: KEYCLOAK_ISSUER
              value: "https://identity.hsaai.example/realms/hsaai"
            - name: KEYCLOAK_JWKS_URL
              value: "http://keycloak.hsaai-data.svc.cluster.local:8080/realms/hsaai/protocol/openid-connect/certs"
            - name: KEYCLOAK_REALM
              value: "hsaai"
            - name: KEYCLOAK_URL
              value: "http://keycloak.hsaai-data.svc.cluster.local:8080"
            - name: LLM_GATEWAY_URL
              value: "http://llm-gateway:8090"
            - name: LOCAL_FILE_STORAGE
              value: "/data/local_uploads"
            - name: LOCAL_LLM_MODEL
              value: "qwen2.5:7b-instruct"
            - name: OLLAMA_BASE_URL
              value: "http://ollama.hsaai-data.svc.cluster.local:11434"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.hsaai-data.svc.cluster.local:4317"
            - name: QDRANT_URL
              value: "http://qdrant.hsaai-data.svc.cluster.local:6333"
            - name: RAG_ANSWER_MODEL
              value: "qwen2.5:7b-instruct"
            - name: RAG_ENGINE_URL
              value: "http://rag-service:8030"
            - name: RAG_EVENT_DB
              value: "/data/rag_events.db"
            - name: RUN_MIGRATIONS_ON_STARTUP
              value: "false"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: USE_ALEMBIC
              value: "true"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30  # allow up to 5 minutes for slow LLM warmup
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # set true in production after /tmp volume mount
            capabilities:
              drop: ["ALL"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agent-runtime
---
