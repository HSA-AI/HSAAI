---
# Source: hsaai-enterprise-os/templates/networkpolicies.yaml
# Default deny all egress from HSAAI namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: hsaai  # FIX v2.1: was missing, selectors now match
  policyTypes:
    - Egress
---
# Source: hsaai-enterprise-os/templates/networkpolicies.yaml
# Default deny all ingress to HSAAI namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: hsaai
  policyTypes:
    - Ingress
---
# Source: hsaai-enterprise-os/templates/networkpolicies.yaml
# Allow internal services to communicate (same namespace + part-of=hsaai label)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-services
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: hsaai
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: hsaai
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: hsaai
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Source: hsaai-enterprise-os/templates/networkpolicies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-data-services-and-ingress
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: hsaai
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hsaai-data
