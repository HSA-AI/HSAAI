# HSAAI Test Suite — pytest Configuration (v5.0)
# FIX v5.0: Re-enabled coverage gate + fixed source paths after zombie cleanup.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=services
    --cov=packages
    --cov-fail-under=80
    --cov-report=term-missing
    --cov-report=html:tests/coverage_html
    --cov-report=xml:tests/coverage.xml
markers =
    e2e: end-to-end tests (require running services)
    integration: integration tests (require testcontainers)
    load: load tests (run with locust, not pytest)
    security: security regression tests
    contract: API contract tests
    slow: slow tests (>5s)
    unit: unit tests (fast, isolated)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# FIXED (audit): [coverage:run] removed from pytest.ini — coverage.py never
# reads pytest.ini; the authoritative coverage config is [tool.coverage.run]
# in pyproject.toml.
