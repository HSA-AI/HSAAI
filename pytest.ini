# HSAAI Test Suite — pytest Configuration (v5.0)
# FIX v5.0: Re-enabled coverage gate + fixed source paths after zombie cleanup.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=services
    --cov=packages
    --cov-fail-under=80
    --cov-report=term-missing
    --cov-report=html:tests/coverage_html
    --cov-report=xml:tests/coverage.xml
markers =
    e2e: end-to-end tests (require running services)
    integration: integration tests (require testcontainers)
    load: load tests (run with locust, not pytest)
    security: security regression tests
    contract: API contract tests
    slow: slow tests (>5s)
    unit: unit tests (fast, isolated)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
# FIX v5.0: Updated source list after zombie service cleanup.
source =
    services/auth_service
    services/rag_engine
    services/llm_gateway
    services/multi_agents
    services/workflow_engine
    services/pii_detector
    services/mcp_server
    services/model_training
    services/api_gateway
    services/governance
    services/ai_alignment
    services/backend_core
    packages/common
omit =
    */__pycache__/*
    */_deprecated_*
    */tests/*
    */migrations/*
