# Agent binding for Warehouses department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: warehouses-agent-binding
  labels:
    department: DEPT-WRH
    department-name: "Warehouses"
spec:
  departmentId: DEPT-WRH
  departmentName: Warehouses
  agentId: AGENT-WAREHOUSE
  agentRef: ../../department-agents/warehouse/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
