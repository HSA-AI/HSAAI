# Agent binding for Finance department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: finance-agent-binding
  labels:
    department: DEPT-FIN
    department-name: "Finance"
spec:
  departmentId: DEPT-FIN
  departmentName: Finance
  agentId: AGENT-FINANCE
  agentRef: ../../department-agents/finance/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
