# Integrations used by Compliance department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: compliance-integrations
spec:
  departmentId: DEPT-COMP
  integrations:
  - id: sharepoint
  - id: m365
  - id: power-bi
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
