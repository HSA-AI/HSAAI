# Agent binding for Compliance department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: compliance-agent-binding
  labels:
    department: DEPT-COMP
    department-name: "Compliance"
spec:
  departmentId: DEPT-COMP
  departmentName: Compliance
  agentId: AGENT-COMPLIANCE
  agentRef: ../../department-agents/compliance/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
