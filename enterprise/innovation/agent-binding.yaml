# Agent binding for Innovation department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: innovation-agent-binding
  labels:
    department: DEPT-INN
    department-name: "Innovation"
spec:
  departmentId: DEPT-INN
  departmentName: Innovation
  agentId: AGENT-EXEC-ASSISTANT
  agentRef: ../../department-agents/exec-assistant/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
