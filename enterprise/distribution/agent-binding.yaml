# Agent binding for Distribution department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: distribution-agent-binding
  labels:
    department: DEPT-DIST
    department-name: "Distribution"
spec:
  departmentId: DEPT-DIST
  departmentName: Distribution
  agentId: AGENT-SUPPLY-CHAIN
  agentRef: ../../department-agents/supply-chain/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
