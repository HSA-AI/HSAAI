# Agent binding for Cybersecurity department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: cybersecurity-agent-binding
  labels:
    department: DEPT-SEC
    department-name: "Cybersecurity"
spec:
  departmentId: DEPT-SEC
  departmentName: Cybersecurity
  agentId: AGENT-CYBERSECURITY
  agentRef: ../../department-agents/cybersecurity/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
