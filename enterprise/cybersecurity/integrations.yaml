# Integrations used by Cybersecurity department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: cybersecurity-integrations
spec:
  departmentId: DEPT-SEC
  integrations:
  - id: active-directory
  - id: azure-ad
  - id: siem
  - id: vault
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
