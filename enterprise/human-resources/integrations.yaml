# Integrations used by Human Resources department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: human-resources-integrations
spec:
  departmentId: DEPT-HR
  integrations:
  - id: oracle-hcm
  - id: m365
  - id: sharepoint
  - id: active-directory
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
