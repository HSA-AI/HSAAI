# Agent binding for Human Resources department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: human-resources-agent-binding
  labels:
    department: DEPT-HR
    department-name: "Human Resources"
spec:
  departmentId: DEPT-HR
  departmentName: Human Resources
  agentId: AGENT-HR
  agentRef: ../../department-agents/hr/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
