# Agent binding for Sales department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: sales-agent-binding
  labels:
    department: DEPT-SALES
    department-name: "Sales"
spec:
  departmentId: DEPT-SALES
  departmentName: Sales
  agentId: AGENT-SALES
  agentRef: ../../department-agents/sales/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
