# Integrations used by Research & Development department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: research-development-integrations
spec:
  departmentId: DEPT-RND
  integrations:
  - id: sharepoint
  - id: power-bi
  - id: m365
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
