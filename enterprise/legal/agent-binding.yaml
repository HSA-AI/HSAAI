# Agent binding for Legal department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: legal-agent-binding
  labels:
    department: DEPT-LEG
    department-name: "Legal"
spec:
  departmentId: DEPT-LEG
  departmentName: Legal
  agentId: AGENT-LEGAL
  agentRef: ../../department-agents/legal/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
