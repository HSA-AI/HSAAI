# Integrations used by Data Office department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: data-office-integrations
spec:
  departmentId: DEPT-DATA
  integrations:
  - id: sql-server
  - id: postgresql
  - id: mongodb
  - id: redis
  - id: kafka
  - id: power-bi
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
