# Agent binding for Data Office department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: data-office-agent-binding
  labels:
    department: DEPT-DATA
    department-name: "Data Office"
spec:
  departmentId: DEPT-DATA
  departmentName: Data Office
  agentId: AGENT-KNOWLEDGE
  agentRef: ../../department-agents/knowledge/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
