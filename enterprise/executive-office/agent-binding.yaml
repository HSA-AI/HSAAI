# Agent binding for Executive Office department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: executive-office-agent-binding
  labels:
    department: DEPT-EXEC
    department-name: "Executive Office"
spec:
  departmentId: DEPT-EXEC
  departmentName: Executive Office
  agentId: AGENT-EXEC
  agentRef: ../../department-agents/exec/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
