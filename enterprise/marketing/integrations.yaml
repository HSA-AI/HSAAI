# Integrations used by Marketing department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: marketing-integrations
spec:
  departmentId: DEPT-MKT
  integrations:
  - id: crm
  - id: power-bi
  - id: sharepoint
  - id: m365
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
