# Agent binding for Procurement department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: procurement-agent-binding
  labels:
    department: DEPT-PROC
    department-name: "Procurement"
spec:
  departmentId: DEPT-PROC
  departmentName: Procurement
  agentId: AGENT-PROCUREMENT
  agentRef: ../../department-agents/procurement/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
