# Integrations used by Procurement department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: procurement-integrations
spec:
  departmentId: DEPT-PROC
  integrations:
  - id: sap
  - id: oracle-erp
  - id: dynamics-365
  - id: sharepoint
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
