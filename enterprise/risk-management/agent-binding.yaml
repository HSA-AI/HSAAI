# Agent binding for Risk Management department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: risk-management-agent-binding
  labels:
    department: DEPT-RISK
    department-name: "Risk Management"
spec:
  departmentId: DEPT-RISK
  departmentName: Risk Management
  agentId: AGENT-COMPLIANCE
  agentRef: ../../department-agents/compliance/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
