# Top-level workflows for Internal Audit department
apiVersion: hsaaiv2/v1
kind: DepartmentWorkflows
metadata:
  name: internal-audit-workflows
spec:
  departmentId: DEPT-AUD
  workflowEngine: services/workflow_engine/
  workflows:
    - id: WF-DEPT-AUD-001
      name: "Daily Briefing"
      trigger: cron
      schedule: "0 7 * * *"
      steps:
        - fetch_kpis
        - generate_briefing
        - notify_department_head
    - id: WF-DEPT-AUD-002
      name: "Issue Escalation"
      trigger: event
      event: issue_detected
      steps:
        - classify_issue
        - route_to_agent
        - notify_approvers
        - track_resolution
    - id: WF-DEPT-AUD-003
      name: "Monthly Report"
      trigger: cron
      schedule: "0 6 1 * *"
      steps:
        - aggregate_monthly_data
        - generate_report
        - submit_for_review
        - distribute
