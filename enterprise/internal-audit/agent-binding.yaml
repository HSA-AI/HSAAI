# Agent binding for Internal Audit department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: internal-audit-agent-binding
  labels:
    department: DEPT-AUD
    department-name: "Internal Audit"
spec:
  departmentId: DEPT-AUD
  departmentName: Internal Audit
  agentId: AGENT-AUDIT
  agentRef: ../../department-agents/audit/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
