# Integrations used by Internal Audit department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: internal-audit-integrations
spec:
  departmentId: DEPT-AUD
  integrations:
  - id: power-bi
  - id: sharepoint
  - id: m365
  - id: sql-server
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
