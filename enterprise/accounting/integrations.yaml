# Integrations used by Accounting department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: accounting-integrations
spec:
  departmentId: DEPT-ACC
  integrations:
  - id: sap
  - id: oracle-erp
  - id: sql-server
  - id: postgresql
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
