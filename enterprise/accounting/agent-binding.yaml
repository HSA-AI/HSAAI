# Agent binding for Accounting department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: accounting-agent-binding
  labels:
    department: DEPT-ACC
    department-name: "Accounting"
spec:
  departmentId: DEPT-ACC
  departmentName: Accounting
  agentId: AGENT-ACCOUNTING
  agentRef: ../../department-agents/accounting/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
