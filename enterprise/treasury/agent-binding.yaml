# Agent binding for Treasury department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: treasury-agent-binding
  labels:
    department: DEPT-TRE
    department-name: "Treasury"
spec:
  departmentId: DEPT-TRE
  departmentName: Treasury
  agentId: AGENT-TREASURY
  agentRef: ../../department-agents/treasury/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
