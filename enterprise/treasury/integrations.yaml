# Integrations used by Treasury department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: treasury-integrations
spec:
  departmentId: DEPT-TRE
  integrations:
  - id: sap
  - id: oracle-erp
  - id: sql-server
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
