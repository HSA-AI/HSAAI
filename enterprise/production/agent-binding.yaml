# Agent binding for Production department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: production-agent-binding
  labels:
    department: DEPT-PROD
    department-name: "Production"
spec:
  departmentId: DEPT-PROD
  departmentName: Production
  agentId: AGENT-MANUFACTURING
  agentRef: ../../department-agents/manufacturing/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
