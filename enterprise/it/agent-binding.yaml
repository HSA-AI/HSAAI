# Agent binding for IT department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: it-agent-binding
  labels:
    department: DEPT-IT
    department-name: "IT"
spec:
  departmentId: DEPT-IT
  departmentName: IT
  agentId: AGENT-IT
  agentRef: ../../department-agents/it/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
