# Agent binding for Logistics department
apiVersion: hsaaiv2/v1
kind: DepartmentAgentBinding
metadata:
  name: logistics-agent-binding
  labels:
    department: DEPT-LOG
    department-name: "Logistics"
spec:
  departmentId: DEPT-LOG
  departmentName: Logistics
  agentId: AGENT-LOGISTICS
  agentRef: ../../department-agents/logistics/
  autoInvoke: false
  humanInTheLoop: true
  auditAllCalls: true
  allowedTools:
    - rag_search
    - knowledge_graph_query
    - llm_complete
    - mcp_tool_call
  forbiddenActions:
    - delete_record
    - drop_table
    - financial_posting_without_approval
