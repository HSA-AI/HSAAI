# Integrations used by Logistics department
apiVersion: hsaaiv2/v1
kind: DepartmentIntegrations
metadata:
  name: logistics-integrations
spec:
  departmentId: DEPT-LOG
  integrations:
  - id: wms
  - id: tms
  - id: kafka
  - id: rabbitmq
  defaultAuth:
    type: oauth2
    provider: keycloak
  retryPolicy:
    maxRetries: 3
    backoff: exponential
  circuitBreaker:
    enabled: true
    threshold: 5
