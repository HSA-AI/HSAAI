# Configuration template for Linux Server
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: linux-servers-config
  labels:
    integration: INT-LINUX-SERVER
    category: server
    vendor: Generic
spec:
  enabled: true
  endpoint: "${INT-LINUX-SERVER_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/linux-servers"
  auth:
    type: public key
    clientId: "${INT-LINUX-SERVER_CLIENT_ID}"
    clientSecret: "vault:linux-servers/client-secret"
    tenant: "${INT-LINUX-SERVER_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
