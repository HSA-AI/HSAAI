# Configuration template for Windows Server
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: windows-servers-config
  labels:
    integration: INT-WIN-SERVER
    category: server
    vendor: Microsoft
spec:
  enabled: true
  endpoint: "${INT-WIN-SERVER_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/windows-servers"
  auth:
    type: kerberos
    clientId: "${INT-WIN-SERVER_CLIENT_ID}"
    clientSecret: "vault:windows-servers/client-secret"
    tenant: "${INT-WIN-SERVER_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
