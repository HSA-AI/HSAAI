# Configuration template for File Servers (SMB/NFS)
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: file-servers-config
  labels:
    integration: INT-FILE-SERVER
    category: file
    vendor: Generic
spec:
  enabled: true
  endpoint: "${INT-FILE-SERVER_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/file-servers"
  auth:
    type: kerberos
    clientId: "${INT-FILE-SERVER_CLIENT_ID}"
    clientSecret: "vault:file-servers/client-secret"
    tenant: "${INT-FILE-SERVER_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
