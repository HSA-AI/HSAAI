# Configuration template for Oracle ERP Cloud
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: oracle-erp-config
  labels:
    integration: INT-ORACLE-ERP
    category: erp
    vendor: Oracle
spec:
  enabled: true
  endpoint: "${INT-ORACLE-ERP_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/oracle-erp"
  auth:
    type: oauth2
    clientId: "${INT-ORACLE-ERP_CLIENT_ID}"
    clientSecret: "vault:oracle-erp/client-secret"
    tenant: "${INT-ORACLE-ERP_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
