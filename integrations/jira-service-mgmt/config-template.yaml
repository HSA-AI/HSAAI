# Configuration template for Jira Service Management
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: jira-service-mgmt-config
  labels:
    integration: INT-JIRA
    category: productivity
    vendor: Atlassian
spec:
  enabled: true
  endpoint: "${INT-JIRA_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/jira-service-mgmt"
  auth:
    type: api token
    clientId: "${INT-JIRA_CLIENT_ID}"
    clientSecret: "vault:jira-service-mgmt/client-secret"
    tenant: "${INT-JIRA_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
