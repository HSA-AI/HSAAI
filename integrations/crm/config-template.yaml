# Configuration template for Customer Relationship Management (CRM)
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: crm-config
  labels:
    integration: INT-CRM
    category: crm
    vendor: Multiple
spec:
  enabled: true
  endpoint: "${INT-CRM_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/crm"
  auth:
    type: oauth2
    clientId: "${INT-CRM_CLIENT_ID}"
    clientSecret: "vault:crm/client-secret"
    tenant: "${INT-CRM_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
