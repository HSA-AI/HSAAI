# Configuration template for MongoDB
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: mongodb-config
  labels:
    integration: INT-MONGODB
    category: database
    vendor: MongoDB
spec:
  enabled: true
  endpoint: "${INT-MONGODB_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/mongodb"
  auth:
    type: scram
    clientId: "${INT-MONGODB_CLIENT_ID}"
    clientSecret: "vault:mongodb/client-secret"
    tenant: "${INT-MONGODB_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
