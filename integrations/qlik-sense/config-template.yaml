# Configuration template for Qlik Sense
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: qlik-sense-config
  labels:
    integration: INT-QLIK
    category: bi
    vendor: Qlik
spec:
  enabled: true
  endpoint: "${INT-QLIK_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/qlik-sense"
  auth:
    type: jwt
    clientId: "${INT-QLIK_CLIENT_ID}"
    clientSecret: "vault:qlik-sense/client-secret"
    tenant: "${INT-QLIK_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
