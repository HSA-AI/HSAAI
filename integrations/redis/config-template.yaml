# Configuration template for Redis
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: redis-config
  labels:
    integration: INT-REDIS
    category: database
    vendor: Redis
spec:
  enabled: true
  endpoint: "${INT-REDIS_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/redis"
  auth:
    type: acl
    clientId: "${INT-REDIS_CLIENT_ID}"
    clientSecret: "vault:redis/client-secret"
    tenant: "${INT-REDIS_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
