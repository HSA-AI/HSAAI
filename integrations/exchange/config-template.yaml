# Configuration template for Microsoft Exchange
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: exchange-config
  labels:
    integration: INT-EXCHANGE
    category: productivity
    vendor: Microsoft
spec:
  enabled: true
  endpoint: "${INT-EXCHANGE_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/exchange"
  auth:
    type: oauth2
    clientId: "${INT-EXCHANGE_CLIENT_ID}"
    clientSecret: "vault:exchange/client-secret"
    tenant: "${INT-EXCHANGE_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
