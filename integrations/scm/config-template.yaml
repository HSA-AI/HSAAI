# Configuration template for Supply Chain Management (SCM)
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: scm-config
  labels:
    integration: INT-SCM
    category: manufacturing
    vendor: Multiple
spec:
  enabled: true
  endpoint: "${INT-SCM_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/scm"
  auth:
    type: oauth2
    clientId: "${INT-SCM_CLIENT_ID}"
    clientSecret: "vault:scm/client-secret"
    tenant: "${INT-SCM_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
