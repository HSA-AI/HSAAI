# Configuration template for Microsoft SharePoint
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: sharepoint-config
  labels:
    integration: INT-SHAREPOINT
    category: productivity
    vendor: Microsoft
spec:
  enabled: true
  endpoint: "${INT-SHAREPOINT_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/sharepoint"
  auth:
    type: oauth2
    clientId: "${INT-SHAREPOINT_CLIENT_ID}"
    clientSecret: "vault:sharepoint/client-secret"
    tenant: "${INT-SHAREPOINT_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
