# Configuration template for SAP SuccessFactors
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: successfactors-config
  labels:
    integration: INT-SAP-SF
    category: hcm
    vendor: SAP
spec:
  enabled: true
  endpoint: "${INT-SAP-SF_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/successfactors"
  auth:
    type: oauth2
    clientId: "${INT-SAP-SF_CLIENT_ID}"
    clientSecret: "vault:successfactors/client-secret"
    tenant: "${INT-SAP-SF_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
