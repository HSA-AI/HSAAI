# Configuration template for Oracle Database
apiVersion: hsaaiv2/v1
kind: IntegrationConfig
metadata:
  name: oracle-db-config
  labels:
    integration: INT-ORACLE-DB
    category: database
    vendor: Oracle
spec:
  enabled: true
  endpoint: "${INT-ORACLE-DB_ENDPOINT}"
  credentials:
    source: vault
    path: "secret/hsaai/integrations/oracle-db"
  auth:
    type: db auth
    clientId: "${INT-ORACLE-DB_CLIENT_ID}"
    clientSecret: "vault:oracle-db/client-secret"
    tenant: "${INT-ORACLE-DB_TENANT}"
  pool:
    maxConnections: 20
    idleTimeout: 300s
  retry:
    maxRetries: 3
    backoff: exponential
    initialDelay: 1s
    maxDelay: 30s
  circuitBreaker:
    enabled: true
    failureThreshold: 5
    recoveryTime: 60s
  rateLimit:
    requestsPerSecond: 50
    burst: 100
  observability:
    metricsEnabled: true
    logsEnabled: true
    tracesEnabled: true
    logLevel: info
  security:
    piiDetection: true
    auditAll: true
    tlsMinVersion: "1.3"
